```yaml
name: CI
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Install dependencies
        run: npm install
      - name: Lint code
        run: npm run lint
      - name: Run tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Deploy
        if: github.ref == 'refs/heads/main'
        uses: akhileshns/deploy-to-github-pages@v1
        with:
          BRANCH: gh-pages
          BUILD_DIR: build
          CLEAN_BUILD_DIR: true
```