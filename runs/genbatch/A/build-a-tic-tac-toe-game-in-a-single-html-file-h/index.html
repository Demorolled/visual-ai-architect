<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Tic-Tac-Toe</title><style>#game {display:grid;grid-template-columns:repeat(3,80px);gap:10px}button {padding:20px;font-size:2em;font-weight:bold}</style></head><body><div id="game"><button onclick="handleClick('A')" id="A">A</button><button onclick="handleClick('B')" id="B">B</button><button onclick="handleClick('C')" id="C">C</button><button onclick="handleClick('D')" id="D">D</button><button onclick="handleClick('E')" id="E">E</button><button onclick="handleClick('F')" id="F">F</button><button onclick="handleClick('G')" id="G">G</button><button onclick="handleClick('H')" id="H">H</button><button onclick="handleClick('I')" id="I">I</button></div><script>const gameBoard = {A:null,B:null,C:null,D:null,E:null,F:null,G:null,H:null,I:null};function handleClick(cellId) {if (gameBoard[cellId]) return;let currentPlayer = 'X';gameBoard[cellId] = currentPlayer;currentPlayer = ((currentPlayer === 'X') ? 'O' : 'X');checkWin();checkDraw();}function checkWin() {const winningCombinations = [['A','B','C'],['D','E','F'],['G','H','I'],['A','D','G'],['B','E','H'],['C','F','I'],['A','E','I'],['C','E','G']];for (const combo of winningCombinations) {const [a, b, c] = combo;if (gameBoard[a] && gameBoard[a] === gameBoard[b] && gameBoard[a] === gameBoard[c]) {alert(`Player ${gameBoard[a]} wins!`);resetGame();return;}}}function checkDraw() {let isFull = true;for (const key in gameBoard) {isFull = isFull && (gameBoard[key] !== null);}if (isFull) {alert('A draw happened!');resetGame();}}function resetGame() {for (const key in gameBoard) {gameBoard[key] = null;document.getElementById(key).textContent = '';}}</script></body></html>
