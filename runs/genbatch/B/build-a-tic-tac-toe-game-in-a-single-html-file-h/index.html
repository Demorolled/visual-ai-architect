<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <<title>Tic-Tac-Toe</title>
  <style>
    body { margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; background: #1a1a2e; color: #fff; font-family: 'Arial', sans-serif; }
    .board { display: grid; grid-template-columns: repeat(3, 80px); grid-gap: 5px; }
    .cell { width: 80px; height: 80px; display: flex; justify-content: center; align-items: center; font-size: 48px; border: 1px solid #333; background: #2b2b3b; cursor: pointer; transition: background 0.3s, transform 0.3s; }
    .cell:hover { background: #3c3d4f; }
    .player { margin-top: 20px; font-size: 16px; color: #fff; text-align: center; }
    .game-result { margin-top: 20px; font-size: 24px; color: #4cddcc; text-align: center; }
    #restartBtn { display: none; margin-top: 10px; padding: 10px 20px; font-size: 16px; cursor: pointer; background: #4cddcc; color: #1a1a2e; border: none; border-radius: 5px; transition: background 0.3s, transform 0.3s; }
    #restartBtn:hover { background: #5adee8; }
  </style>
</head>
<body>
  <div class="player" id="player">PLAYER X</div>
  <div class="winner" id="winner"></div>
  <div class="board" id="board"></div>
  <button id="restartBtn" onclick="restartGame()">Restart Game</button>
  <script>
    const board = document.querySelector('#board');
class TicTacToe {
      constructor() {
        this.grid = [' ', ' ', ' ', ' ', ' ', ' ', ' ', ' ', ' '];
        this.player = 'X';
        this.gameOver = false;
      }
      render() {
        board.innerHTML = '';
        this.grid.forEach((cell, index) => {
          const square = document.createElement('div');
          square.className = 'square';
          square.textContent = cell;
          square.dataset.index = index;;
          square.onclick = () => this.handlePlay(index);
          board.appendChild(square);
        });
      }
      switchPlayer() {
        this.player = this.player === 'X' ? 'O' : 'X';
      }
      checkWin() {
        const winningCombos = [
          [0, 1, 2], [3, 4, 5], [6, 7, 8],
          [0, 3, 6], [1, 4, 7], [2, 5, 8],
          [0, 4, 8], [2, 4, 6]
        ];
        for (const combo of winningCombos) {
          const [a, b, c] = combo;
          if (this.grid[a] && this.grid[a] === this.grid[b] && this.grid[a] === this.grid[c]) {
            return this.grid[a];
          }
        }
        return null;
      }
      handlePlay(index) {
        if (this.gameOver || this.grid[index] !== ' ') return;
        this.grid[index] = this.player;
        this.gameOver = this.checkWin() ? true : !this.grid.includes(' ');
        // const winner = this.checkWin();
        // if (winner) {
        //   board.classList.add(`winner-${winner}`);
        // }
        board.classList.remove('winner-x', 'winner-o');
        this.render();
      }
    }
    const game = new TicTacToe();
    const currentPlayer = document.getElementById('player');
    currentPlayer.textContent = 'PLAYER ' + game.player;

    function handlePlay(index) {
      game.handlePlay(index);
      // updatePlayer();
      checkWinner();
    }

    function updatePlayer() {
      currentPlayer.textContent = 'PLAYER ' + game.player;
    }

    function checkWinner() {
      const board = document.querySelector('#board');
      const winner = game.checkWin();
      if (winner) {
        console.log('Winner is ' + winner);
        board.classList.add('winner-' + winner);
      } else if (!game.grid.includes(' ')) {
        console.log('Game tied');
        board.classList.add('tied');
      }
    }

    const restartBtn = document.getElementById('restartBtn');
    restartBtn.onclick = () => {
      game.reset();
      updatePlayer();
      checkWinner();
      board.classList.remove('winner-x', 'winner-o', 'tied');
    };
  </script>
</body>
</html>
