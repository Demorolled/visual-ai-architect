<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conway's Game of Life</title>
  <style>
    .grid { display: grid; grid-template-columns: repeat(5, 10px); gap: 1px; }
    .cell { width: 10px; height: 10px; background-color: #f0f0f0; display: inline-block; }
    .control-row { display: flex; justify-content: center; gap: 10px; margin-top: 10px; }
  </style>
</head>
<body>
  <h1>Conway's Game of Life</h1>
  <div class="grid" id="grid"></div>
  <div class="control-row">
    <button id="start">Start</button>
    <button id="step">Step</button>
    <button id="clear">Clear</button>
    <span id="generation">0</span>
  </div>
  <script type="module" src="./game.ts"></script>
</body>
</html>
