<div class="app">
  <textarea id="codeInput" placeholder="Enter JavaScript code here..." rows="10" cols="50"></textarea>
  <button id="runBtn" class="btn" onclick="runCode()">Run</button>
  <div id="outputPanel" class="col"><b>Output</b><pre id="outputText"></pre></div>
</div>
<script>
function runCode() {
  const code = document.getElementById('codeInput').value.trim();
  if (!code) return;
  try {
    const result = eval(code);
    const out = document.getElementById('outputPanel');
    document.getElementById('outputText').textContent = String(result);
  } catch (e) {
    const out = document.getElementById('outputPanel');
    out.innerHTML = e instanceof SyntaxError ? e.message : 'Error running code';
  }
}
</script>
