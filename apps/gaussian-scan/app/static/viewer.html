<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Scan viewer</title>
<style>
  :root { color-scheme: dark; }
  html,body { margin:0; height:100%; background:#0b0d10; overflow:hidden;
              font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif; color:#e8eaed; }
  canvas { display:block; touch-action:none; }
  #hud { position:fixed; left:10px; bottom:10px; right:10px; display:flex; gap:8px;
         align-items:center; flex-wrap:wrap; pointer-events:none; }
  #hud a, #hud button { pointer-events:auto; background:#1b1f24cc; color:#e8eaed;
         border:1px solid #2c333b; border-radius:10px; padding:9px 13px;
         text-decoration:none; font:inherit; cursor:pointer; backdrop-filter:blur(8px); }
  #hud a:active, #hud button:active { background:#2a3138; }
  #status { margin-left:auto; background:#1b1f24cc; border:1px solid #2c333b;
            border-radius:10px; padding:9px 13px; backdrop-filter:blur(8px); }
  #err { position:fixed; inset:auto 12px 60px 12px; padding:12px 14px; border-radius:12px;
         background:#3a1416; border:1px solid #6b2a2e; display:none; white-space:pre-wrap; }
  #bar { position:fixed; top:0; left:0; height:3px; width:0; background:#5aa9ff; transition:width .2s; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "/vendor/three.module.js",
    "three/addons/": "/vendor/addons/",
    "@sparkjsdev/spark": "/vendor/spark.module.js"
  }
}
</script>
</head>
<body>
<div id="bar"></div>
<div id="err"></div>
<div id="hud">
  <a id="download" href="#">Download .ply</a>
  <button id="reset">Recentre</button>
  <button id="spin">Auto-spin</button>
  <span id="status">loading…</span>
</div>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { SparkRenderer, SplatMesh } from "@sparkjsdev/spark";

const scanId = location.pathname.split("/").filter(Boolean).pop();
const url = `/api/scans/${scanId}/model`;
const statusEl = document.getElementById("status");
const errEl = document.getElementById("err");
const bar = document.getElementById("bar");
document.getElementById("download").href = url;
document.getElementById("download").download = `${scanId}.ply`;

function fail(msg) {
  errEl.style.display = "block";
  errEl.textContent = "Could not display this scan:\n" + msg;
  statusEl.textContent = "error";
  console.error(msg);
}
addEventListener("error", e => fail(e.message || String(e.error)));

let camera, controls, splat, scene, renderer;
let spin = false, ready = false, homeData = null;

try {
  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  document.body.appendChild(renderer.domElement);

  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.01, 5000);
  camera.position.set(1.2, 0.7, 1.2);

  controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.rotateSpeed = 0.85;

  // Spark must be added to the scene and handed the renderer.
  scene.add(new SparkRenderer({ renderer }));

  splat = new SplatMesh({
    url,
    onProgress: e => {
      if (e.lengthComputable) {
        const p = Math.round(100 * e.loaded / e.total);
        bar.style.width = p + "%";
        statusEl.textContent = `loading ${p}%`;
      } else {
        statusEl.textContent = `loading ${(e.loaded / 1e6).toFixed(0)} MB`;
      }
    },
  });
  scene.add(splat);

  // ── The render loop starts BEFORE awaiting `initialized` on purpose ──────
  // Spark decodes/streams inside its per-frame update, so awaiting
  // `initialized` while no frames are being rendered can stall forever. Spark's
  // own getting-started example adds the mesh and calls setAnimationLoop
  // immediately, with no await in between. Do the same, then frame the object
  // once it is actually ready.
  const up = new THREE.Vector3(0, 1, 0);
  renderer.setAnimationLoop(() => {
    if (spin) {
      const step = 0.006;
      const r = camera.position.clone().sub(controls.target).applyAxisAngle(up, step);
      camera.position.copy(controls.target).add(r);
    }
    controls.update();
    renderer.render(scene, camera);
  });

  splat.initialized.then(() => {
    // nerfstudio exports "Vertical Axis: z" but three.js is Y-up, so an
    // un-rotated splat stands on its side. -90° about X maps +Z to +Y.
    splat.rotation.set(-Math.PI / 2, 0, 0);
    splat.updateMatrixWorld(true);

    const localBox = splat.getBoundingBox();
    if (!localBox || localBox.isEmpty()) throw new Error("the splat has no geometry");

    const size = localBox.getSize(new THREE.Vector3());
    const centre = splat.localToWorld(localBox.getCenter(new THREE.Vector3()));
    const radius = Math.max(size.x, size.y, size.z) * 0.5 || 1;
    const dist = (radius / Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2)) * 1.9;
    homeData = { centre, dist };

    home();
    ready = true;
    // SplatMesh exposes the count as a *property*; `getNumSplats()` is a method on
    // the inner PackedSplats/SplatLoader objects, not on the mesh itself.
    statusEl.textContent = `${(splat.numSplats ?? 0).toLocaleString()} splats`;
    bar.style.opacity = 0;
  }).catch(e => fail(e && e.message ? e.message : String(e)));
} catch (e) {
  fail(e && e.message ? e.message : String(e));
}

function home() {
  if (!homeData) return;
  const { centre, dist } = homeData;
  camera.position.set(centre.x + dist * 0.6, centre.y + dist * 0.35, centre.z + dist * 0.6);
  camera.near = Math.max(dist / 500, 0.001);
  camera.far = dist * 50;
  camera.updateProjectionMatrix();
  controls.target.copy(centre);
  controls.minDistance = dist * 0.15;
  controls.maxDistance = dist * 6;
  controls.update();
}

document.getElementById("reset").onclick = home;
const spinBtn = document.getElementById("spin");
spinBtn.onclick = () => { spin = !spin; spinBtn.textContent = spin ? "Stop spin" : "Auto-spin"; };

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
