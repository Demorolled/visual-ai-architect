<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Spiral Galaxy</title>
	<style>
		body { margin: 0; overflow: hidden; background: #000; }
		#scene { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; }
		#regenerate { position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%); }
	</style>
</head>
<body>
	<canvas id="scene"></canvas>
	<div id="regenerate">Regenerate</div>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
	<script>
		const scene = new THREE.Scene();
		const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
		const renderer = new THREE.WebGLRenderer({ antialias: true });
		renderer.setSize(window.innerWidth, window.innerHeight);
		document.querySelector('#scene').appendChild(renderer.domElement);
		const controls = new THREE.OrbitControls(camera, renderer.domElement);
		const light = new THREE.DirectionalLight(0xffffff, 1);
		light.position.set(-1, 2, 1).normalize();
		scene.add(light);
		const core = new THREE.SphereGeometry(2, 32, 32);
		const coreMat = new THREE.MeshBasicMaterial({ color: 0xff8040 });
		const coreMesh = new THREE.Mesh(core, coreMat);
		scene.add(coreMesh);
		const particles = [];
		const count = 10000;
		for (let i = 0; i < count; i++) {
			const geometry = new THREE.SphereGeometry(0.05, 16, 16);
			const material = new THREE.MeshBasicMaterial({ color: 0x80ff80, transparent: true, opacity: 0.75 });
			const mesh = new THREE.Mesh(geometry, material);
			mesh.position.set(
				Math.random() * 10 - 5,
				Math.random() * 10 - 5,
				Math.random() * 10 - 5
			);
			particles.push(mesh);
			scene.add(mesh);
		}
		camera.position.z = 20;
		function regenerate() {
			particles.forEach((p) => scene.remove(p));
			particles.length = 0;
			for (let i = 0; i < count; i++) {
				const geometry = new THREE.SphereGeometry(0.05, 16, 16);
				const material = new THREE.MeshBasicMaterial({ color: 0x80ff80, transparent: true, opacity: 0.75 });
				const mesh = new THREE.Mesh(geometry, material);
				mesh.position.set(
					Math.random() * 10 - 5,
					Math.random() * 10 - 5,
					Math.random() * 10 - 5
				);
				particles.push(mesh);
				scene.add(mesh);
			}
			rotateSpeed = 0.01 + Math.random() * 0.02;
			armCount = 3 + Math.floor(Math.random() * 6);
			coreMesh.scale.set(2 + Math.random() * 2, 2 + Math.random() * 2, 2 + Math.random() * 2);
		}
		const rotateSpeed = 0.01;
		const armCount = 3;
		function animate() {
			requestAnimationFrame(animate);
			particles.forEach((p) => {
				p.rotation.x += rotateSpeed;
				p.rotation.y += rotateSpeed;
				p.rotation.z += rotateSpeed;
			});
			renderer.render(scene, camera);
		}
		renderer.setAnimationLoop(() => {});
		animate();
		document.querySelector('#regenerate').addEventListener('click', regenerate);
		window.addEventListener('resize', () => {
			camera.aspect = window.innerWidth / window.innerHeight;
			camera.updateProjectionMatrix();
			renderer.setSize(window.innerWidth, window.innerHeight);
		});
	</script>
</body>
</html>
