<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Night City Skyline</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
  #scene { position: fixed; inset: 0; }
  #controls { position: fixed; left: 12px; bottom: 12px; z-index: 100; }
  #controls button { background: rgba(10,10,10,0.35); color: #fff; border: 1px solid rgba(255,255,255,0.2); padding: 8px 12px; margin: 0 4px; font-size: 13px; border-radius: 4px; cursor: pointer; outline: none; transition: transform 0.125s, background 0.125s, color 0.125s; }
  #controls button:hover { transform: translate3d(0,-1px,0); }
  #controls button:active { transform: translate3d(0,1px,0); }
  #controls button:hover, #controls button:active { background: rgba(10,10,10,0.55); color: #ffd; }
  #cityCount { position: fixed; bottom: 36px; left: 40%; font-size: 12px; color: rgba(255,255,255,0.45); }
</style>
</head>
<body>
<div id="scene"></div>
<div id="controls">
  <button id="randomize">Randomize City</button>
  <div id="cityCount">City: 0</div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, innerWidth / innerHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer();
renderer.setSize(innerWidth, innerHeight);
document.getElementById('scene').appendChild(renderer.domElement);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
camera.position.set(0, 12, 25);

const clock = new THREE.Clock();

const cityGroup = new THREE.Group();
scene.add(cityGroup);

const light = new THREE.DirectionalLight(0xffffff, 1);
light.position.set(-1, 2, 1).normalize();
scene.add(light);

const fog = new THREE.Fog(0x0b0b14, 25, 75);
scene.fog = fog;

const random = (min, max) => Math.random() * (max - min) + min;

const buildCity = () => {
  cityGroup.traverse((o) => { if (o.geometry) scene.remove(o); });
  cityGroup.children.length = 0;
  const count = 200 + Math.floor(Math.random() * 150);
  let cityCount = 0;
  for (let i = 0; i < count; i++) {
    const height = 1 + Math.floor(Math.random() * 10);
    const width = 0.3 + 0.5 * Math.random();
    const y = -6 + 3 * Math.random();
    const x = (6 * (Math.random() - 0.5) * 100);
    const floorMesh = new THREE.Mesh(
      new THREE.BoxGeometry(width, 1, height),
      new THREE.MeshStandardMaterial({ color: 0x0000ff, roughness: 0.2 })
    );
    const roofMesh = new THREE.Mesh(
      new THREE.BoxGeometry(width, 1, height),
      new THREE.MeshStandardMaterial({ color: 0x00ff00, roughness: 0.2 })
    );
    floorMesh.position.set(x, y, 0);
    roofMesh.position.set(x, y + 1, 0);
    roofMesh.rotation.x = Math.PI / 2;
    const lightMesh = new THREE.Mesh(
      new THREE.BoxGeometry(0.4, 0.4, 0.4),
      new THREE.MeshBasicMaterial({ color: 0xffffff })
    );
    lightMesh.position.set(x, y + 0.5 + 0.2 * Math.random(), 0);
    cityGroup.add(floorMesh, roofMesh, lightMesh);
    cityCount++;
  }
  document.getElementById('cityCount').textContent = `City: ${cityCount}`;
};

const animate = () => {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  renderer.render(scene, camera);
  controls.update();
};

buildCity();
renderer.setAnimationLoop(animate);

document.getElementById('randomize').addEventListener('click', buildCity);

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
