<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Butterfly Swarm</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #1e2934; font-family: system-ui, sans-serif; }
    #scene { position: fixed; inset: 0; }
    #controls { position: fixed; top: 14px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; z-index: 10; }
    #controls button { padding: 10px 18px; font-size: 14px; border: 1px solid rgba(255,255,255,0.2); border-radius: 10px; color: #d0d0d0; background: transparent; cursor: pointer; transition: transform 0.15s, background 0.15s, color 0.15s; }
    #controls button:hover { transform: translateX(2px); }
    #controls button:active { transform: translateX(2px) scale(0.95); }
    #count { color: rgba(255,255,255,0.35); font-size: 12px; }
  </style>
</head>
<body>
  <canvas id="scene"></canvas>
  <div id="controls">
    <button id="respawn">Respawn</button>
    <div id="count">0</div>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script>
    const scene = new THREE.Scene();
    scene.background = new THREE.Color('grey');
    const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    document.body.appendChild(renderer.domElement);
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    camera.position.set(0, 12, 20);
    scene.add(new THREE.AmbientLight(0xffffff, 0.6));
    const light = new THREE.DirectionalLight(0xffffff, 0.9);
    light.position.set(-1, 3, 2).normalize();
    scene.add(light);
    const fog = new THREE.Fog('grey', 25, 50);
    scene.fog = fog;
    const butterflyMeshes = [];
    const butterflyCount = 40;
    const respawn = () => {
      butterflyMeshes.forEach((butterflyMesh) => { scene.remove(butterflyMesh.mesh); butterflyMesh.dispose(); });
      butterflyMeshes.length = 0;
      const countEl = document.getElementById('count');
      countEl.textContent = 0;
      for (let i = 0; i < butterflyCount; i++) {
        const butterflyMesh = buildButterfly();
        butterflyMeshes.push(butterflyMesh);
        scene.add(butterflyMesh.mesh);
      }
      countEl.textContent = butterflyMeshes.length;
    };
    respawn();
    const countEl = document.getElementById('count');
    const respawnButton = document.getElementById('respawn');
    respawnButton.addEventListener('click', respawn);
    const clock = new THREE.Clock();
    const animate = () => {
      renderer.render(scene, camera);
      requestAnimationFrame(animate);
      butterflyMeshes.forEach((butterflyMesh) => {
        butterflyMesh.update(clock.getDelta());
      });
    };
    animate();
    window.addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });
    class ButterflyMesh {
      constructor() {
        this.mesh = this.buildMesh();
        this.velocity = new THREE.Vector3();
        this.path = [];
        this.pathLength = 0;
        this.pathIndex = 0;
        this.target = new THREE.Vector3();
        this.speed = 0.005 + Math.random() * 0.01;
        this.angularSpeed = 0.002 + Math.random() * 0.005;
        this.alive = true;
      }
      buildMesh() {
        const geometry = new THREE.SphereGeometry(0.15, 32, 32);
        const material = new THREE.MeshStandardMaterial({ color: Math.random() * 0xffffff, roughness: 0.35 });
        const mesh = new THREE.Mesh(geometry, material);
        mesh.castShadow = true;
        return mesh;
      }
      update(dt) {
        if (!this.alive) return;
        const target = this.path[this.pathIndex];
        if (!target) {
          this.path = [];
          this.pathLength = 0;
          this.pathIndex = 0;
          this.target.set(0, 0, 0);
          return;
        }
        const distance = this.mesh.position.distanceTo(target);
        if (distance < 0.15) {
          this.pathIndex++;
          if (this.pathIndex >= this.pathLength) {
            this.path = [];
            this.pathLength = 0;
            this.pathIndex = 0;
            this.target.set(0, 0, 0);
            return;
          }
          this.target.copy(this.path[this.pathIndex]);
        }
        const dir = this.target.clone().sub(this.mesh.position).normalize();
        this.mesh.position.add(dir.multiplyScalar(dt * this.speed));
        this.mesh.rotation.x += dt * this.angularSpeed;
        this.mesh.rotation.y += dt * this.angularSpeed;
        this.mesh.rotation.z += dt * this.angularSpeed;
      }
      dispose() {
        this.mesh.geometry.dispose();
        this.mesh.material.dispose();
      }
    }
  </script>
</body>
</html>
