    #shake { position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%); z-index: 10; }
    #shake button { padding: 10px 24px; font-size: 14px; border: 1px solid rgba(255,255,255,0.2); border-radius: 12px; background: rgba(255,255,255,0.05); color: #fff; cursor: pointer; transition: all 0.2s; }
    #shake button:hover { background: rgba(255,255,255,0.15); }
  </style>
</head>

    document.body.appendChild(renderer);

    renderer.height = innerHeight;

      const material = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.5 });
      const mesh = new THREE.Mesh(geometry, material);
      mesh.position.set((Math.random() - 0.5) * 500, (Math.random() - 0.5) * 500, (Math.random() - 0.5) * 500);
      mesh.velocity = (Math.random() - 0.5) * 1;
      scene.add(mesh);
      snow.push(mesh);
    }
    const base = new THREE.Mesh(new THREE.CylinderGeometry(300, 300, 20, 32), new THREE.MeshStandardMaterial({ color: 0x8b4513 }));

    scene.add(house);

    });

        s.position.z = (s.position.z + 1) % 1000 - 500;
      });
