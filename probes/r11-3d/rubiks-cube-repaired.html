<!DOCTYPE html>
<html>
<head>
<title>3D Rubik's Cube</title>
<style>
#container { width: 500px; height: 500px; }
</style>
</head>
<body>
<div id="container"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, 1, 0.1, 1000);
camera.position.set(0, 0, 3);
const renderer = new THREE.WebGLRenderer();
renderer.setSize(500, 500);
document.querySelector('#container').appendChild(renderer.domElement);
const controls = new THREE.OrbitControls(camera, renderer.domElement);
const cube = new THREE.Mesh(
  new THREE.BoxGeometry(1, 1, 1),
  new THREE.MeshBasicMaterial({ color: 0x00ff00 })
);
scene.add(cube);
const light = new THREE.PointLight(0xffffff, 1);
light.position.set(2, 2, 2);
scene.add(light);
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
const animate = () => {
  requestAnimationFrame(animate);
  renderer.render(scene, camera);
};
animate();
window.addEventListener('resize', () => {
  renderer.setSize(window.innerWidth, window.innerHeight);
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
});
document.addEventListener('keydown', (e) => {
  const key = e.key.toLowerCase();
  if (key === 'w') cube.rotation.x += Math.PI / 180;
  else if (key === 'a') cube.rotation.y -= Math.PI / 180;
  else if (key === 's') cube.rotation.x -= Math.PI / 180;
  else if (key === 'd') cube.rotation.y += Math.PI / 180;
  animate();
});
const shuffle = () => {
  cube.rotation.x = Math.random() * Math.PI;
  cube.rotation.y = Math.random() * Math.PI;
  animate();
};
const reset = () => {
  cube.rotation.set(0, 0, 0);
  animate();
};
document.addEventListener('click', (e) => {
  mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  const intersects = raycaster.intersectObjects(scene.children);
  if (intersects.length) {
    if (intersects[0].object === cube) {
      shuffle();
    }
  }
});
document.querySelector('#container').innerHTML += `
  <button onclick="shuffle()">Shuffle</button>
  <button onclick="reset()">Reset</button>
`;
</script>
</body>
</html>
