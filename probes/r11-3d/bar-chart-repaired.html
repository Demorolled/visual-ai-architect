<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Bar Chart</title>
  <style>
    body { margin: 0; font-family: Arial, sans-serif; }
    canvas { display: block; }
    #tooltip { position: absolute; bottom: 0; left: 0; padding: 8px; background: rgba(0,0,0,0.7); color: #fff; border-radius: 4px; pointer-events: none; }
  </style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="tooltip"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
const canvas = document.getElementById('canvas');
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, canvas.width / canvas.height, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ canvas });
renderer.setSize(canvas.width, canvas.height);
const controls = new THREE.OrbitControls(camera, canvas);
camera.position.z = 500;
let data = [10, 25, 20, 35, 22, 30, 35, 40, 32, 45, 42, 48];
let colors = ['#ff0000', '#ff7f00', '#ffff00', '#00ff00', '#0000ff', '#8b00ff', '#9400d3', '#ff00ff', '#ff69b4', '#ff1493', '#ff00ff', '#ff69b4'];
let bars = [];
let lastMouse = { clientX: 0, clientY: 0 };
window.addEventListener('mousemove', e => { lastMouse = { clientX: e.clientX, clientY: e.clientY }; });
const tooltip = document.getElementById('tooltip');
tooltip.style.display = 'none';
function createBar(index, value, color) {
  const geometry = new THREE.BoxGeometry(100, value * 10, 100);
  const material = new THREE.MeshBasicMaterial({ color });
  const mesh = new THREE.Mesh(geometry, material);
  mesh.position.set((index - 6) * 200, value * 10, 0);
  scene.add(mesh);
  bars.push(mesh);
  return mesh;
}
function animate() {
  requestAnimationFrame(animate);
  renderer.render(scene, camera);
  controls.update();
  const mouse = new THREE.Vector2();
  const canvasRect = canvas.getBoundingClientRect();
  const x = (lastMouse.clientX - canvasRect.left) / canvasRect.width * 2 - 1;
  const y = -(lastMouse.clientY - canvasRect.top) / canvasRect.height * 2 + 1;
  mouse.x = x;
  mouse.y = y;
  raycaster.setFromCamera(mouse, camera);
  const intersects = raycaster.intersectObjects(bars);
  if (intersects.length > 0) {
    tooltip.textContent = intersects[0].object.position.y / 10;
    tooltip.style.left = lastMouse.clientX + 'px';
    tooltip.style.top = lastMouse.clientY + 'px';
    tooltip.style.display = 'block';
  } else {
    tooltip.style.display = 'none';
  }
}
function newData() {
  scene.clear();
  bars.forEach(mesh => scene.remove(mesh));
  bars = [];
  data = [];
  colors = [];
  for (let i = 0; i < 12; i++) {
    const value = Math.floor(Math.random() * 50) + 10;
    data.push(value);
    colors.push(`hsl(${i * 30}, 100%, 50%)`);
  }
  for (let i = 0; i < data.length; i++) {
    createBar(i + 1, data[i], colors[i]);
  }
}
newData();
const raycaster = new THREE.Raycaster();
animate();
</script>
</body>
</html>
