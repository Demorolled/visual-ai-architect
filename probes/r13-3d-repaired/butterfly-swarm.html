<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Butterfly Swarm</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #1e2934; font-family: system-ui, sans-serif; }
  #scene { position: fixed; inset: 0; }
  #controls { position: fixed; top: 12px; left: 12px; z-index: 10; display: flex; gap: 8px; font-size: 14px; }
  #controls button { padding: 8px 14px; font-size: 14px; border: 1px solid rgba(255,255,255,0.2); border-radius: 4px; color: #d0d0d0; background: transparent; cursor: pointer; transition: all 0.2s; }
  #controls button:hover { background: rgba(255,255,255,0.08); color: #fff; }
  #count { color: #808080; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
<div id="scene"></div>
<div id="controls">
  <button id="respawn">Respawn</button>
  <div id="count">0</div>
</div>
<script>
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1e2934);
scene.fog = new THREE.Fog(0x1e2934, 250, 400);

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 1000);
camera.position.set(0, 12, 25);

const renderer = new THREE.WebGLRenderer();
renderer.setSize(innerWidth, innerHeight);
document.getElementById('scene').appendChild(renderer.domElement);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.maxPolarAngle = Math.PI * 0.85;
controls.target.set(0, 10, 0);
controls.update();

const light = new THREE.DirectionalLight(0xffffff, 1);
light.position.set(-1, 2, 1).normalize();
scene.add(light);

const butterfly = new THREE.Mesh(
  new THREE.SphereGeometry(0.25, 32, 32),
  new THREE.MeshStandardMaterial({ color: 0xff4d4d, metalness: 0.3, roughness: 0.5 })
);
butterfly.userData = { path: [], speed: 0.1, phase: 0 };

const butterflyGroup = new THREE.Group();
scene.add(butterflyGroup);

const count = document.getElementById('count');
const respawnButton = document.getElementById('respawn');

function respawn() {
  butterflyGroup.traverse((o) => { if (o.isMesh) o.visible = false; });
  butterflyGroup.children = [];
  count.textContent = 0;
  butterflyGroup.userData = null;
  butterflyGroup.position.set(0, 10, 0);
  butterflyGroup.updateMatrixWorld();
  butterflyGroup.userData = {
    path: [],
    speed: 0.05 + Math.random() * 0.4,
    phase: 0,
    target: null,
    targetSpeed: 0.25 + Math.random() * 0.5,
    targetAngle: 0,
  };
  for (let i = 0; i < 40; i++) {
    const b = butterfly.clone();
    b.position.set((Math.random() - 0.5) * 10, (Math.random() - 0.5) * 10, (Math.random() - 0.5) * 10);
    b.userData = { path: [], speed: 0.1, phase: 0 };
    butterflyGroup.add(b);
  }
  count.textContent = butterflyGroup.children.length;
  respawnButton.disabled = true;
}

respawnButton.addEventListener('click', respawn);

function update(dt) {
  butterflyGroup.children.forEach((butterfly) => {
    const b = butterfly.userData;
    if (!b.path) return;
    const t = b.phase += dt * b.speed;
    let path = b.path.slice();
    if (path.length < 2) return;
    const p0 = path[0];
    const p1 = path[1];
    const d = new THREE.Vector3().copy(p1).sub(p0);
    const dlen = d.length();
    d.normalize();
    const pos = new THREE.Vector3();
    let target = b.target;
    if (!target) {
      target = new THREE.Vector3().copy(p1);
      const angle = (Math.random() - 0.5) * Math.PI * 0.2;
      target.add(p0).multiplyScalar(0.85 + Math.random() * 0.2);
      target.add(new THREE.Vector3(Math.cos(b.targetAngle) * 2, 0, Math.sin(b.targetAngle) * 2));
      b.target = target;
      b.targetSpeed = 0.25 + Math.random() * 0.5;
      b.targetAngle = (Math.random() - 0.5) * Math.PI * 0.5;
    }
    const tpos = new THREE.Vector3().lerpVectors(p0, target, t / b.targetSpeed);
    const tposv = new THREE.Vector3().copy(tpos);
    pos.copy(p0).addScaledVector(d, t);
    b.position.copy(pos);
    const dist = tposv.distanceTo(pos);
    if (dist < 0.1) {
      path.shift();
      if (path.length < 2) {
        b.target = null;
        b.targetSpeed = 0;
        return;
      }
      tposv.copy(path[0]).add(p0).multiplyScalar(0.85 + Math.random() * 0.2);
      tposv.add(new THREE.Vector3(Math.cos(b.targetAngle) * 2, 0, Math.sin(b.targetAngle) * 2));
      b.target = tposv;
      b.targetSpeed = 0.25 + Math.random() * 0.5;
      b.targetAngle = (Math.random() - 0.5) * Math.PI * 0.5;
    }
    b.position.copy(tpos);
  });
  renderer.render(scene, camera);
  requestAnimationFrame(update);
}

update();

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

</script>
</body>
</html>
