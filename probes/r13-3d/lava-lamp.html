<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Lava Lamp</title>
  <style>
    html, body { margin: 0; padding: 0; overflow: hidden; width: 100%; height: 100%; background: #000; }
    #scene { position: fixed; inset: 0; }
  </style>
</head>
<body>
<div id="scene"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
    const scene = new THREE.Scene();
    scene.background = new THREE.Color('black');
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.querySelector('#scene').appendChild(renderer.domElement);
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    camera.position.z = 300;
    const ambient = new THREE.AmbientLight(0x222222);
    scene.add(ambient);
    const light = new THREE.DirectionalLight(0xffffff, 1);
    light.position.set(-1, 2, 2).normalize();
    scene.add(light);
    const glass = new THREE.Mesh(
      new THREE.SphereGeometry(200, 32, 32),
      new THREE.MeshStandardMaterial({ color: 0x2222ff, transparent: true, opacity: 0.8 })
    );
    scene.add(glass);
    const blobs = [];
    for (let i = 0; i < 50; i++) {
      const blob = new THREE.Mesh(
        new THREE.SphereGeometry(5 + Math.random() * 15, 16, 16),
        new THREE.MeshBasicMaterial({ color: 0xff8844 })
      );
      blob.position.set((Math.random() - 0.5) * 400, 0, (Math.random() - 0.5) * 400);
      blob.velocity = new THREE.Vector3(0, 0, 0);
      blob.speed = Math.random() * 0.5 + 0.5;
      blobs.push(blob);
      scene.add(blob);
    }
    function update() {
      blobs.forEach(blob => {
        blob.position.y += blob.velocity.y * 0.01;
        if (blob.position.y > 200) {
          blob.position.y = 200;
          blob.velocity.y = -(blob.speed * 100);
        }
        if (blob.position.y < -200) {
          blob.position.y = -200;
          blob.velocity.y = blob.speed * 100;
        }
        blob.velocity.y += 0.01;
        blob.rotation.x += 0.05;
        blob.rotation.y += 0.05;
      });
      requestAnimationFrame(update);
      renderer.render(scene, camera);
    }
    update();
</script>
</body>
</html>
