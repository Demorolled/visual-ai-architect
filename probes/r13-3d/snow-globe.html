<!DOCTYPE html>
<html>
<head>
<title>❄️ Snow Globe</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#0f0f1a;font-family:system-ui,sans-serif;}
  #scene{position:fixed;width:100%;height:100%;}
  #fallback{display:none;color:#eee;text-align:center;padding:20px;font-size:1.25rem;}
  #shake{position:fixed;bottom:20px;width:100%;text-align:center;font-size:1.25rem;cursor:pointer;z-index:10;}
</style>
</head>
<body>
<div id="scene"></div>
<div id="fallback">Your browser doesn't support WebGPU (WebGL2) — try a different browser!</div>
<div id="shake">shake it up</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.getElementById('scene').appendChild(renderer.domElement);
    scene.background = new THREE.Color(0x0f0f1a);
    const cameraControls = new THREE.OrbitControls(camera, renderer.domElement);
    camera.position.z = 500;
    scene.add(new THREE.HemisphereLight(0xffffff, 0x444455));
    const dome = new THREE.Mesh(
      new THREE.SphereGeometry(150, 60, 60),
      new THREE.MeshStandardMaterial({ color: 0x333366, roughness: 0.3 })
    );
    scene.add(dome);
    const base = new THREE.Mesh(
      new THREE.CylinderGeometry(100, 100, 100, 32),
      new THREE.MeshStandardMaterial({ color: 0x444433, roughness: 0.6 })
    );
    scene.add(base);
    const house = new THREE.Group();
    const roof = new THREE.Mesh(
      new THREE.ConeGeometry(30, 40, 16),
      new THREE.MeshStandardMaterial({ color: 0x884422, roughness: 0.5 })
    );
    roof.position.y = 50;
    const chimney = new THREE.Mesh(
      new THREE.CylinderGeometry(5, 15, 30, 16),
      new THREE.MeshStandardMaterial({ color: 0xff6633, roughness: 0.2 })
    );
    chimney.position.y = 75;
    const tree = new THREE.Mesh(
      new THREE.ConeGeometry(20, 30, 16),
      new THREE.MeshStandardMaterial({ color: 0x224422, roughness: 0.6 })
    );
    tree.position.y = 80;
    house.add(roof, chimney, tree);
    house.position.y = 0;
    scene.add(house);
    const snow = [];
    for (let i = 0; i < 200; i++) {
      const geometry = new THREE.SphereGeometry(1, 16, 16);
      const material = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 1 });
      const mesh = new THREE.Mesh(geometry, material);
      mesh.position.set((Math.random() - 0.5) * 400, 200 + (Math.random() * 200), (Math.random() - 0.5) * 400);
      mesh.velocity = (Math.random() - 0.5) * 2;
      mesh.scale.y = 0.5;
      scene.add(mesh);
      snow.push(mesh);
    }
    let shake = false;
    document.getElementById('shake').addEventListener('click', () => { shake = true; });
    function animate() {
      requestAnimationFrame(animate);
      if (shake) { dome.rotation.x += 0.02; dome.rotation.y += 0.02; shake = false; }
      snow.forEach((s) => { s.position.y += s.velocity; if (s.position.y < -200) { s.position.y = 200 + (Math.random() * 200); s.velocity = (Math.random() - 0.5) * 2; } });
      renderer.render(scene, camera);
    }
    animate();
</script>
</body>
</html>
