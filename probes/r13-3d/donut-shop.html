<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html,body { width: 100%; height: 100%; overflow: hidden; background: #0c0c25; }
  #scene { position: fixed; inset: 0; }
  canvas { display: block; }
  footer { position: fixed; bottom: 12px; left: 12px; z-index: 10; font-family: system-ui, sans-serif; color: #e8e8f4; }
  footer a { color: inherit; text-decoration: none; }
</style>
</head>
<body>
<div id="scene"></div>
<footer>
  <a href="https://glitch.com/edit/#!/three-donut-showcase?ref=glitch-com" target="_blank">-built with Three.js</a>
</footer>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
    const scene = new THREE.Scene();
    scene.background = new THREE.Color('grey');
    scene.fog = new THREE.Fog('grey', 40, 90);
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 300);
    camera.position.set(0, 10, 20);
    const renderer = new THREE.WebGLRenderer();
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.getElementById('scene').appendChild(renderer.domElement);
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    const donut = new THREE.Mesh(
      new THREE.TorusKnotGeometry(1.6, 0.4, 80, 128),
      new THREE.MeshStandardMaterial({ color: 0x4a0025, roughness: 0.35 })
    );
    donut.scale.set(3.2, 3.2, 3.2);
    donut.rotation.x = -Math.PI / 2;
    const spotlight = new THREE.SpotLight(0xffffff, 2.5, 50, Math.PI / 5, 0.3);
    spotlight.position.set(0, 20, 10);
    spotlight.castShadow = true;
    spotlight.shadow.mapSize.set(1024, 1024);
    scene.add(spotlight);
    const plate = new THREE.Mesh(
      new THREE.CircleGeometry(4.2, 64),
      new THREE.MeshStandardMaterial({ color: 0xd98a5a, roughness: 0.35 })
    );
    scene.add(plate);
    scene.add(donut);
    let glaze = 0x751e4a;
    const glazeButton = document.createElement('button');
    glazeButton.style.position = 'fixed';
    glazeButton.style.bottom = '24px';
    glazeButton.style.left = '50%';
    glazeButton.style.transform = 'translateX(-50%)';
    glazeButton.style.zIndex = '10';
    glazeButton.style.width = '160px';
    glazeButton.style.height = '48px';
    glazeButton.style.border = '1px solid rgba(255,255,255,0.1)';
    glazeButton.style.borderRadius = '24px';
    glazeButton.style.fontSize = '14px';
    glazeButton.style.backgroundColor = '#1a1a35';
    glazeButton.style.color = '#e8e8f4';
    glazeButton.style.padding = '12px 24px';
    glazeButton.style.cursor = 'pointer';
    glazeButton.textContent = 'New Glaze';
    document.body.appendChild(glazeButton);
    glazeButton.addEventListener('click', () => {
      const newGlaze = 0x5a2b69 + Math.random() * 0x8a4b8a;
      donut.material.color.setHex(newGlaze);
      glaze = newGlaze;
    });
    let time = 0;
    function animate() {
      requestAnimationFrame(animate);
      donut.rotation.y += 0.005;
      donut.rotation.x += 0.005;
      time += 0.01;
      spotlight.position.x = 10 * Math.cos(time / 20) * Math.cos(time / 20);
      spotlight.position.z = 10 * Math.sin(time / 20) * Math.cos(time / 20);
      renderer.render(scene, camera);
    }
    animate();
</script>
</body>
</html>
