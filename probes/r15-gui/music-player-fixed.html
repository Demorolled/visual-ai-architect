<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Player</title>
    <style>
        body { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; background: #000; font-family: system-ui, sans-serif; }
        .player { width: 100%; max-width: 600px; padding: 20px; background: rgba(0, 0, 0, 0.7); border-radius: 12px; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3); display: flex; flex-direction: column; gap: 10px; }
        .album-art { width: 300px; height: 300px; margin: 0 auto; border-radius: 12px; display: flex; align-items: center; justify-content: center; position: relative;
            background: linear-gradient(135deg, #7f5af0, #2cb67d, #e53170); }
        .album-art::after { content: '🎵'; font-size: 120px; filter: drop-shadow(0 4px 8px rgba(0,0,0,0.4)); }
        .controls { display: flex; align-items: center; justify-content: center; gap: 10px; }
        .controls button { width: 48px; height: 48px; border: none; background: rgba(255, 255, 255, 0.1); color: #fff; font-size: 18px; cursor: pointer; outline: none; transition: all 0.2s; border-radius: 50%; }
        .controls button:hover { background: rgba(255, 255, 255, 0.25); }
        .controls button:active { transform: translateY(1px); }
        .seek { width: 100%; max-width: 300px; height: 6px; margin: 0 auto; background: rgba(255, 255, 255, 0.1); border-radius: 6px; position: relative; cursor: pointer; }
        .seek-fill { height: 100%; border-radius: 6px; position: absolute; left: 0; bottom: 0; background: #2cb67d; width: 0%; }
        .track-title { font-size: 18px; color: #fff; text-align: center; }
        .track-artist { font-size: 13px; color: rgba(255, 255, 255, 0.6); text-align: center; }
        .playlist { width: 100%; max-width: 300px; margin: 0 auto; height: 180px; overflow-y: scroll; padding: 10px 0; list-style: none; }
        .playlist li { padding: 8px 12px; color: #fff; cursor: pointer; border-radius: 8px; }
        .playlist li:hover { background: rgba(255, 255, 255, 0.05); }
        .playlist li.active { background: rgba(255, 255, 255, 0.15); }
        .volume { display: flex; align-items: center; justify-content: center; gap: 10px; }
        .volume label { color: #fff; font-size: 14px; }
        .volume input { width: 120px; accent-color: #2cb67d; }
    </style>
</head>
<body>
    <div class="player">
        <div class="album-art"></div>
        <div class="controls">
            <button id="prev" title="Previous">❮</button>
            <button id="play" title="Play/Pause">▶</button>
            <button id="next" title="Next">❯</button>
        </div>
        <div class="track-title">Track 1</div>
        <div class="track-artist">Artist 1</div>
        <div class="seek">
            <div class="seek-fill"></div>
        </div>
        <ul class="playlist">
            <li data-track="0" class="active">Track 1 — Artist 1</li>
            <li data-track="1">Track 2 — Artist 2</li>
            <li data-track="2">Track 3 — Artist 3</li>
            <li data-track="3">Track 4 — Artist 4</li>
            <li data-track="4">Track 5 — Artist 5</li>
        </ul>
        <div class="volume">
            <label for="volume">Vol:</label>
            <input type="range" id="volume" min="0" max="100" value="100">
        </div>
    </div>

    <script>
        const playButton = document.getElementById('play');
        const prevButton = document.getElementById('prev');
        const nextButton = document.getElementById('next');
        const seek = document.querySelector('.seek');
        const seekFill = document.querySelector('.seek-fill');
        const trackTitle = document.querySelector('.track-title');
        const trackArtist = document.querySelector('.track-artist');
        const playlistItems = document.querySelectorAll('.playlist li');
        const volumeInput = document.getElementById('volume');

        let trackIndex = 0;
        let isPlaying = false;
        let trackDuration = 240;
        let trackTime = 0;
        let timer = null;

        // SELF-CONTAINED: no external URLs. Tracks are metadata only; playback
        // is a synthesized WebAudio tone so the app works fully offline.
        const tracks = [
            { title: 'Track 1', artist: 'Artist 1', duration: 240 },
            { title: 'Track 2', artist: 'Artist 2', duration: 220 },
            { title: 'Track 3', artist: 'Artist 3', duration: 260 },
            { title: 'Track 4', artist: 'Artist 4', duration: 230 },
            { title: 'Track 5', artist: 'Artist 5', duration: 250 },
        ];

        function updateTrackDisplay() {
            const t = tracks[trackIndex];
            trackTitle.textContent = t.title;
            trackArtist.textContent = t.artist;
            trackDuration = t.duration;
            trackTime = 0;
            seekFill.style.width = '0%';
            playlistItems.forEach((li, i) => li.classList.toggle('active', i === trackIndex));
        }

        function playTrack() {
            isPlaying = true;
            playButton.textContent = '❚❚';
            playTone();
            timer = setInterval(updateTrackProgress, 100);
        }

        function pauseTrack() {
            isPlaying = false;
            playButton.textContent = '▶';
            if (timer) clearInterval(timer);
            timer = null;
        }

        function updateTrackProgress() {
            trackTime += 0.1;  // 100ms tick; duration is in seconds
            if (trackTime >= trackDuration) {
                trackTime = trackDuration;
                seekFill.style.width = '100%';
                pauseTrack();
                return;
            }
            seekFill.style.width = (trackTime / trackDuration) * 100 + '%';
        }

        function playTone() {
            // A short synthesized beep proves playback without any network
            // dependency (no <audio src>, no CDN). Volume follows the slider.
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.frequency.value = 440 + trackIndex * 60;
                gain.gain.value = (volumeInput.value / 100) * 0.1;
                osc.connect(gain).connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.4);
            } catch (e) { /* audio not available — visuals still work */ }
        }

        function onPlayButtonClick() {
            if (isPlaying) pauseTrack(); else playTrack();
        }

        function onPrevButtonClick() {
            trackIndex = (trackIndex - 1 + tracks.length) % tracks.length;
            updateTrackDisplay();
            if (isPlaying) playTrack();
        }

        function onNextButtonClick() {
            trackIndex = (trackIndex + 1) % tracks.length;
            updateTrackDisplay();
            if (isPlaying) playTrack();
        }

        function onSeekClick(e) {
            const rect = seek.getBoundingClientRect();
            const ratio = Math.min(1, Math.max(0, (e.clientX - rect.left) / rect.width));
            trackTime = Math.floor(ratio * trackDuration);
            seekFill.style.width = ratio * 100 + '%';
        }

        function onPlaylistItemClick(e) {
            const li = e.target.closest('li');
            if (!li || li.dataset.track === undefined) return;
            trackIndex = parseInt(li.dataset.track, 10);
            updateTrackDisplay();
            if (isPlaying) playTrack();
        }

        playButton.addEventListener('click', onPlayButtonClick);
        prevButton.addEventListener('click', onPrevButtonClick);
        nextButton.addEventListener('click', onNextButtonClick);
        seek.addEventListener('click', onSeekClick);
        document.querySelector('.playlist').addEventListener('click', onPlaylistItemClick);

        updateTrackDisplay();
    </script>
</body>
</html>
