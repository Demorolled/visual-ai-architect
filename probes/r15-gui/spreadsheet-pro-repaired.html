<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editable Spreadsheet</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        table, td, th { border: 1px solid #ddd; padding: 8px; }
        th { background-color: #f2f2f2; text-align: left; }
        .formula-bar { margin-top: 10px; display: flex; }
        .formula-bar input { width: 100%; padding: 4px; margin-right: 10px; }
        .cell:hover { background-color: #f0f0f0; }
        .selected { background-color: #ccc; }
    </style>
</head>
<body>
    <table id="spreadsheet"></table>
    <div class="formula-bar">
        <input id="formula-input">
        <button onclick="addFormula()">Add Formula</button>
    </div>

    <script>
        const rows = 20, cols = 8;
        const spreadsheet = document.getElementById('spreadsheet');

        for (let r = 0; r < rows; r++) {
            const row = document.createElement('tr');
            for (let c = 0; c < cols; c++) {
                const cell = document.createElement('td');
                cell.className = 'cell';
                cell.textContent = `A${r + 1}${c === 0 ? '' : (c + 1)}`;
                cell.contentEditable = true;
                cell.oninput = () => recalculate();
                cell.onmousedown = () => selectCell(cell);
                row.appendChild(cell);
            }
            spreadsheet.appendChild(row);
        }

        let selectedCell = null;
        function selectCell(cell) {
            if (selectedCell) selectedCell.classList.remove('selected');
            selectedCell = cell;
            selectedCell.classList.add('selected');
        }

        function recalculate() {
            const cells = document.querySelectorAll('.cell');
            const values = {};
            cells.forEach(cell => {
                if (cell.textContent.startsWith('=')) {
                    try {
                        const result = eval(cell.textContent.slice(1));
                        values[cell] = result;
                    } catch (e) {
                        console.error(e);
                    }
                }
            });
            cells.forEach(cell => {
                if (cell.textContent.startsWith('=')) return;
                const value = values[cell] || cell.textContent;
                cell.textContent = value;
            });
        }

        function addFormula() {
            const input = document.getElementById('formula-input');
            const cells = input.value.split(',').map(cell => document.querySelector(`.cell:is([contenteditable], [data-cell="${cell}"])`));
            const formula = `=${cells.map(cell => cell.textContent).join('+')}`;
            cells.forEach(cell => {
                cell.textContent = '';
                cell.contentEditable = true;
                cell.oninput = () => recalculate();
            });
            const newCell = document.createElement('td');
            newCell.className = 'cell';
            newCell.textContent = formula;
            newCell.contentEditable = true;
            newCell.oninput = () => recalculate();
            selectCell(newCell);
            input.value = '';
        }
    </script>
</body>
</html>
