<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Retro Terminal</title>
  <style>
    body { margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; background: #000; }
    .terminal { width: 40vw; max-width: 600px; height: 80vh; overflow-y: scroll; background: #0f0; color: #000; font-family: 'Courier New', Courier, monospace; padding: 20px; }
    .terminal:before { content: 'Loading...'; display: block; margin-bottom: 20px; font-size: 1.2rem; color: #0f0; }
    .history { margin-top: 10px; }
    .history .command { margin: 2px 0; }
    .history .command code { display: block; white-space: pre-wrap; }
    .cursor { border-bottom: 1px solid #000; animation: blink 1s step-end infinite; }
    @keyframes blink { to { border-bottom: none; } }
  </style>
</head>
<body>
  <div class="terminal" id="terminal">
    <div class="history" id="history"></div>
    <div contenteditable="true" class="cursor" id="input"></div>
  </div>
  <script>
    const terminal = document.getElementById('terminal');
    const history = document.getElementById('history');
    const input = document.getElementById('input');

    const commands = {
      help: () => { history.appendChild(document.createElement('div')).innerHTML = '<code>help</code><br>Available commands: ls, cat, date, clear, echo</code>'; },
      ls: () => { history.appendChild(document.createElement('div')).innerHTML = '<code>ls</code><br>[file1.txt, file2.txt]</code>'; },
      cat: (args) => { if (args.length < 1) return; const file = args[0]; history.appendChild(document.createElement('div')).innerHTML = `<code>cat ${file}</code><br><pre>${document.querySelector(`[data-file="${file}"]`).innerHTML}</pre>`; },
      date: () => { history.appendChild(document.createElement('div')).innerHTML = '<code>date</code><br>2023-03-23</code>'; },
      clear: () => { history.innerHTML = ''; input.innerHTML = ''; },
      echo: (args) => { if (args.length < 1) return; history.appendChild(document.createElement('div')).innerHTML = `<code>echo ${args.join(' ')}</code><br>${args.join(' ')}</code>`; },
    };

    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        const value = input.innerHTML.trim();
        input.innerHTML = '';
        if (value) {
          const args = value.split(' ').filter(Boolean);
          const cmd = args.shift();
          if (commands[cmd]) commands[cmd](args);
          history.scrollTop = history.scrollHeight;
        }
      }
    });
  </script>
</body>
</html>
