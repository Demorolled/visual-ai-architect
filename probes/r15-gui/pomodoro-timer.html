<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pomodoro Timer</title>
<style>
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; background: #222; font-family: system-ui, sans-serif; }
  h1 { color: #fff; margin-bottom: 20px; }
  .timer { width: 300px; height: 300px; background: conic-gradient(#ff6b6b 0% 25%, #fff 25% 50%, #ff6b6b 50% 75%, #fff 75% 100%); display: grid; place-items: center; margin: 40px 0; }
  .time { font-size: 2.5rem; color: #fff; }
  .controls { display: flex; flex-direction: column; gap: 10px; }
  button { padding: 10px 20px; font-size: 1rem; cursor: pointer; }
  .session { margin-top: 20px; font-size: 1rem; color: #fff; }
</style>
</head>
<body>
<h1>Pomodoro Timer</h1>
<div class="timer"></div>
<div class="controls">
  <button id="start">Start</button>
  <button id="pause">Pause</button>
  <button id="reset">Reset</button>
</div>
<div class="session">Session: <span id="session">25</span></div>

<canvas id="progress"></canvas>

<script>
const timer = document.querySelector('.timer');
const startBtn = document.getElementById('start');
const pauseBtn = document.getElementById('pause');
const resetBtn = document.getElementById('reset');
const sessionDisplay = document.getElementById('session');
const progressCanvas = document.getElementById('progress');

let sessionTime = 1500;
let breakTime = 300;
let currentSession = 'Work';
let isRunning = false;
let minutes = 0;
let seconds = 0;
let interval;

function updateTimerDisplay() {
  const minutesEl = document.querySelector('.time').textContent.padStart(2, '0');
  const secondsEl = (Math.floor(seconds / 100)).padStart(2, '0');
  document.querySelector('.time').textContent = `${minutesEl}:${secondsEl}`;
}

function startTimer() {
  isRunning = true;
  interval = setInterval(() => {
    if (currentSession === 'Work') {
      minutes = Math.floor(seconds / 60);
      seconds %= 60;
    } else {
      minutes = Math.floor(seconds / 60);
      seconds %= 60;
    }
    updateTimerDisplay();
    seconds++;
    if (minutes === 0 && seconds === 0) {
      currentSession = currentSession === 'Work' ? 'Break' : 'Work';
      minutes = 0;
      seconds = 0;
      sessionDisplay.textContent = currentSession;
      if (currentSession === 'Break') {
        seconds = breakTime;
      } else {
        seconds = sessionTime;
      }
    }
  }, 10);
}

function pauseTimer() {
  isRunning = false;
  clearInterval(interval);
}

function resetTimer() {
  pauseTimer();
  minutes = 0;
  seconds = 0;
  document.querySelector('.time').textContent = '00:00';
  sessionDisplay.textContent = 'Work';
  currentSession = 'Work';
}

startBtn.addEventListener('click', startTimer);
pauseBtn.addEventListener('click', pauseTimer);
resetBtn.addEventListener('click', resetTimer);

const canvas = progressCanvas;
const ctx = canvas.getContext('2d');
canvas.width = 200;
canvas.height = 200;
const radius = canvas.width / 2 - 10;

function drawProgress() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.beginPath();
  ctx.arc(radius, radius, radius - 10, Math.PI * 2, false);
  ctx.strokeStyle = '#eee';
  ctx.lineWidth = 10;
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(radius, radius, radius - 10, Math.PI * 2, -(minutes / 25) * Math.PI * 2, false);
  ctx.strokeStyle = '#ff6b6b';
  ctx.lineWidth = 10;
  ctx.stroke();
}

setInterval(drawProgress, 1000);
</script>
</body>
</html>
