<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: system-ui, sans-serif; background: #0e141e; color: #d0d0d0; }
        .container { width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; }
        .cards { width: 90%; max-width: 1200px; display: flex; gap: 20px; margin-bottom: 20px; }
        .card { width: 28%; min-width: 280px; background: rgba(255,255,255,0.05); border-radius: 12px; padding: 20px; }
        .card h2 { margin: 0; font-size: 1.5rem; margin-bottom: 10px; }
        .card span { font-size: 0.85rem; display: block; margin-top: 5px; }
        canvas { display: block; margin-top: 20px; }
        footer { margin-top: 20px; display: flex; justify-content: space-between; align-items: center; padding: 10px 20px; background: rgba(255,255,255,0.05); border-radius: 0 0 12px 12px; }
        footer select { padding: 5px 10px; font-size: 0.85rem; }
        footer button { padding: 5px 10px; font-size: 0.85rem; border: none; background: rgba(255,255,255,0.1); color: #fff; cursor: pointer; }
        footer button:hover { background: rgba(255,255,255,0.2); }
        .tooltip { position: absolute; background: rgba(0,0,0,0.7); color: #fff; border-radius: 4px; padding: 5px 10px; font-size: 0.8rem; white-space: nowrap; }
    </style>
</head>
<body>
    <div class="container">
        <div class="cards">
            <div class="card">
                <h2>Revenue</h2>
                <span>$2,500</span>
                <canvas id="revenueChart"></canvas>
            </div>
            <div class="card">
                <h2>Users</h2>
                <span>1,200</span>
                <canvas id="usersChart"></canvas>
            </div>
            <div class="card">
                <h2>Conversion</h2>
                <span>65%</span>
                <canvas id="conversionChart"></canvas>
            </div>
        </div>
        <footer>
            <select id="dateFilter">
                <option value="daily">Daily</option>
                <option value="weekly" selected>Weekly</option>
                <option value="monthly">Monthly</option>
            </select>
            <button id="clearData">Clear Data</button>
        </footer>
    </div>
    <script>
        const canvasRe = document.getElementById('revenueChart');
        const ctxRe = canvasRe.getContext('2d');
        const canvasUs = document.getElementById('usersChart');
        const ctxUs = canvasUs.getContext('2d');
        const canvasCo = document.getElementById('conversionChart');
        const ctxCo = canvasCo.getContext('2d');

        let data = [];

        function generateData() {
            const count = 7;
            const now = new Date();
            for (let i = 0; i < count; i++) {
                const date = new Date(now);
                date.setDate(now.getDate() - i);
                const revenue = Math.floor(Math.random() * 500) + 100;
                const users = Math.floor(Math.random() * 150) + 50;
                data.push({ date, revenue, users });
            }
            data.sort((a, b) => a.date - b.date);
        }

        function drawChart(ctx, title, values) {
            const margin = 20;
            const width = canvasRe.width - 2 * margin;
            const height = canvasRe.height - 2 * margin;
            const min = Math.min(...values);
            const max = Math.max(...values);
            const scale = height / (max - min);

            ctx.clearRect(0, 0, canvasRe.width, canvasRe.height);
            ctx.fillStyle = '#00d9ff';
            ctx.strokeStyle = '#00d9ff';

            ctx.beginPath();
            values.forEach((value, index) => {
                const x = margin + index * (width / (values.length - 1));
                const y = height - (value - min) * scale;
                if (index === 0) {
                    ctx.moveTo(x, y);
                } else {
                    ctx.lineTo(x, y);
                }
                if (index < values.length - 1) {
                    ctx.lineTo(x, y);
                }
            });
            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = '#d0d0d0';
            ctx.font = '0.8rem system-ui';
            values.forEach((value, index) => {
                const x = margin + index * (width / (values.length - 1));
                const y = height - (value - min) * scale;
                ctx.fillText(value, x, y + 6);
            });

            ctx.fillStyle = '#fff';
            ctx.fillText(title, margin + width / 2, margin / 2);
        }

        function drawTooltip(x, y, value) {
            const tooltip = document.createElement('div');
            tooltip.className = 'tooltip';
            tooltip.textContent = value;
            tooltip.style.left = x + 'px';
            tooltip.style.top = y + 'px';
            document.body.appendChild(tooltip);
        }

        function handleMouseMove(event) {
            const rect = canvasRe.getBoundingClientRect();
            const x = event.clientX - rect.left;
            const y = event.clientY - rect.top;
            if (x >= margin && x <= margin + width && y >= margin && y <= margin + height) {
                const index = Math.floor((x - margin) / (width / (values.length - 1)));
                const value = values[index];
                drawTooltip(x, y, value);
            } else {
                document.querySelectorAll('.tooltip').forEach(tooltip => document.body.removeChild(tooltip));
            }
        }

        document.addEventListener('mousemove', handleMouseMove);

        generateData();
        const valuesRe = data.map(d => d.revenue);
        const valuesUs = data.map(d => d.users);
        const valuesCo = data.map(d => d.revenue / d.users * 100);

        drawChart(ctxRe, 'Revenue', valuesRe);
        drawChart(ctxUs, 'Users', valuesUs);
        drawChart(ctxCo, 'Conversion', valuesCo);

        document.getElementById('dateFilter')?.addEventListener('change', () => {
            data = [];
            generateData();
            valuesRe = data.map(d => d.revenue);
            valuesUs = data.map(d => d.users);
            valuesCo = data.map(d => d.revenue / d.users * 100);
            drawChart(ctxRe, 'Revenue', valuesRe);
            drawChart(ctxUs, 'Users', valuesUs);
            drawChart(ctxCo, 'Conversion', valuesCo);
        });

        document.getElementById('clearData')?.addEventListener('click', () => {
            data = [];
            valuesRe = [];
            valuesUs = [];
            valuesCo = [];
            drawChart(ctxRe, 'Revenue', valuesRe);
            drawChart(ctxUs, 'Users', valuesUs);
            drawChart(ctxCo, 'Conversion', valuesCo);
        });
    </script>
</body>
</html>
