<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>❄️ Snow Globe</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#000;font-family:system-ui,sans-serif}
  #scene{position:fixed;width:100%;height:100%}
  #shake{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:10;cursor:pointer}
  #shake span{display:block;width:200px;height:56px;line-height:56px;font-size:18px;text-align:center;color:#fff;background:rgba(0,0,0,0.3);border-radius:8px;transition:background 0.2s}
  #shake:hover span{background:rgba(0,0,0,0.5)}
</style>
</head>
<body>
<canvas id="scene"></canvas>
<button id="shake"><span>shake</span></button>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
  const renderer = new THREE.WebGLRenderer({canvas: document.getElementById('scene')});
  renderer.setSize(window.innerWidth, window.innerHeight);
  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  camera.position.z = 200;
  const snow = [];
  for (let i = 0; i < 1000; i++) {
    const geometry = new THREE.SphereGeometry(0.2, 20, 20);
    const material = new THREE.MeshBasicMaterial({color: 0xffffff, transparent: true, opacity: 0.75});
    const mesh = new THREE.Mesh(geometry, material);
    mesh.position.set((Math.random() - 0.5) * 300, (Math.random() - 0.5) * 300, (Math.random() - 0.5) * 300);
    mesh.velocity = (Math.random() - 0.5) * 10;
    scene.add(mesh);
    snow.push(mesh);
  }
  const house = new THREE.Mesh(
    new THREE.BoxGeometry(10, 20, 10),
    new THREE.MeshStandardMaterial({color: 0x664d2c})
  );
  house.position.set(50, 0, 50);
  scene.add(house);
  const tree = new THREE.Mesh(
    new THREE.ConeGeometry(5, 20),
    new THREE.MeshStandardMaterial({color: 0x2a3e1e})
  );
  tree.position.set(-50, 0, -50);
  scene.add(tree);
  const base = new THREE.Mesh(
    new THREE.BoxGeometry(200, 10, 200),
    new THREE.MeshStandardMaterial({color: 0x664d2c, roughness: 0.5})
  );
  base.position.y = -5;
  base.rotation.x = -Math.PI / 2;
  scene.add(base);
  const shakeButton = document.getElementById('shake');
  let spinning = false;
  shakeButton.addEventListener('click', () => {
    if (spinning) return;
    spinning = true;
    scene.add(new THREE.Mesh(new THREE.BoxGeometry(100, 100, 100), new THREE.MeshBasicMaterial({color: 0xffffff})));
    setTimeout(() => {
      scene.children.forEach((child) => {
        if (child instanceof THREE.Mesh && child.name !== 'shake') scene.remove(child);
      });
      spinning = false;
    }, 2000);
  });
  function animate() {
    requestAnimationFrame(animate);
    snow.forEach((mesh) => {
      mesh.position.y += mesh.velocity;
      if (mesh.position.y > 300) mesh.position.y = -300;
    });
    renderer.render(scene, camera);
  }
  animate();
</script>
</body>
</html>
