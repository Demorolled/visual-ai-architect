<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Lava Lamp</title>
    <style>
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0d0d12; }
        #scene { position: fixed; inset: 0; }
    </style>
</head>
<body>
    <div id="scene"></div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color('black');
        scene.fog = new THREE.Fog('black', 30, 60);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 3, 5);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('scene').appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.target.set(0, 1, 0);
        controls.update();

        const light = new THREE.DirectionalLight(0xffffff, 0.5);
        light.position.set(-1, 2, 1);
        scene.add(light);

        const glass = new THREE.Mesh(
            new THREE.SphereGeometry(3, 32, 32),
            new THREE.MeshStandardMaterial({ color: 0x333366, transparent: true, opacity: 0.8 })
        );
        scene.add(glass);

        const blobs = [];
        for (let i = 0; i < 20; i++) {
            const blob = new THREE.Mesh(
                new THREE.SphereGeometry(0.2 + Math.random() * 0.6, 16, 16),
                new THREE.MeshBasicMaterial({ color: 0xff4444 })
            );
            blob.position.set((Math.random() - 0.5) * 6, 0, (Math.random() - 0.5) * 6);
            blob.velocity = new THREE.Vector3(0, 0, 0);
            blob.scale.y = 0.9 + Math.random() * 0.2;
            blobs.push(blob);
            scene.add(blob);
        }

        function update() {
            blobs.forEach(blob => {
                blob.position.y += blob.velocity.y * 0.01;
                if (blob.position.y > 2.5) blob.velocity.y = -(0.5 + Math.random());
                if (blob.position.y < 0) blob.velocity.y = 0.5;
                blob.rotation.x += 0.01;
                blob.rotation.y += 0.01;
            });
            renderer.render(scene, camera);
            requestAnimationFrame(update);
        }

        update();
    </script>
</body>
</html>
