<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spiral Galaxy</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
    #scene { position: fixed; inset: 0; }
  </style>
</head>
<body>
<div id="scene"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
    let scene, camera, renderer, controls, core;
    init();
    animate();
    function init() {
      scene = new THREE.Scene();
      scene.background = new THREE.Color('black');
      camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
      renderer = new THREE.WebGLRenderer();
      renderer.setSize(window.innerWidth, window.innerHeight);
      document.getElementById('scene').appendChild(renderer.domElement);
      core = new THREE.Mesh(new THREE.SphereGeometry(1, 32, 32), new THREE.MeshBasicMaterial({ color: 0xff6622 }));
      core.position.z = -2;
      scene.add(core);
      const geometry = new THREE.BufferGeometry();
      const count = 5000;
      const posArray = new Float32Array(count * 3);
      const colArray = new Float32Array(count * 3);
      const pos = new THREE.Vector3();
      for (let i = 0; i < count; i++) {
        pos.set(
          Math.cos(Math.random() * Math.PI * 2) * 10 + Math.random() * 10 - 5,
          Math.random() * 6 - 3,
          Math.sin(Math.random() * Math.PI * 2) * 10 + Math.random() * 10 - 5
        );
        posArray[i * 3] = pos.x; posArray[i * 3 + 1] = pos.y; posArray[i * 3 + 2] = pos.z;
        colArray[i * 3] = 1 - pos.y / 6; colArray[i * 3 + 1] = 0.7 + pos.y / 12; colArray[i * 3 + 2] = 0.4 + pos.y / 12;
      }
      geometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
      geometry.setAttribute('color', new THREE.BufferAttribute(colArray, 3));
      const points = new THREE.Points(geometry, new THREE.PointsMaterial({ size: 0.15 }));
      scene.add(points);
      camera.position.z = 20;
      const regenerateButton = document.createElement('button');
      regenerateButton.innerHTML = 'Regenerate';
      regenerateButton.style.position = 'absolute';
      regenerateButton.style.bottom = '10px';
      regenerateButton.style.left = '50%';
      regenerateButton.style.transform = 'translateX(-50%)';
      regenerateButton.style.zIndex = '10';
      regenerateButton.addEventListener('click', () => {
        scene.remove(core);
        scene.remove(points);
        init();
      });
      document.body.appendChild(regenerateButton);
      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.update();
      window.addEventListener('resize', onWindowResize);
    }
    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }
    function animate() {
      requestAnimationFrame(animate);
      core.rotation.y += 0.005;
      points.rotation.y += 0.005;
      renderer.render(scene, camera);
    }
</script>
</body>
</html>
