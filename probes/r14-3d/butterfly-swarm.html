<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Butterfly Swarm</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #282c34; }
    #scene { position: fixed; inset: 0; }
  </style>
</head>
<body>
<div id="scene"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
    let scene, camera, renderer, clock = new THREE.Clock(), respawning = false;

    function init() {
      scene = new THREE.Scene();
      scene.background = new THREE.Color('skyblue');
      scene.fog = new THREE.Fog('skyblue', 15, 45);

      camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 100);
      camera.position.set(0, 7, 15);

      renderer = new THREE.WebGLRenderer();
      renderer.setSize(window.innerWidth, window.innerHeight);
      document.getElementById('scene').appendChild(renderer.domElement);

      const ambient = new THREE.AmbientLight(0xffffff, 0.4);
      scene.add(ambient);

      const sun = new THREE.DirectionalLight(0xffffff, 0.8);
      sun.position.set(2, 3, 1).normalize();
      scene.add(sun);

      const geometry = new THREE.SphereGeometry(0.25, 24, 24);
      const material = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.3 });
      const butterflies = [];

      for (let i = 0; i < 70; i++) {
        const mesh = new THREE.Mesh(geometry, material);
        mesh.position.set((Math.random() - 0.5) * 20, 1, (Math.random() - 0.5) * 20);
        mesh.velocity = new THREE.Vector3((Math.random() - 0.5) * 0.05, 0, (Math.random() - 0.5) * 0.05);
        mesh.scale.set((Math.random() + 0.5) * 0.25, (Math.random() + 0.5) * 0.25, (Math.random() + 0.5) * 0.25);
        const colors = [0xff00ff, 0xff8000, 0x8000ff, 0x80ff00, 0x00ffff, 0xffff00, 0x00ff80, 0xff0080];
        mesh.material.color.setHex(colors[Math.floor(Math.random() * colors.length)]);
        scene.add(mesh);
        butterflies.push(mesh);
      }

      const orbit = new THREE.OrbitControls(camera, renderer.domElement);
      orbit.enableDamping = true;
      orbit.dampingFactor = 0.05;
      orbit.update();

      const respawnButton = document.createElement('button');
      respawnButton.style.position = 'absolute';
      respawnButton.style.left = '50%';
      respawnButton.style.transform = 'translate(-50%, -50%)';
      respawnButton.style.bottom = '20px';
      respawnButton.style.width = '150px';
      respawnButton.style.height = '40px';
      respawnButton.style.border = '1px solid #6272a4';
      respawnButton.style.borderRadius = '8px';
      respawnButton.style.color = '#e0e0e0';
      respawnButton.style.fontSize = '14px';
      respawnButton.style.cursor = 'pointer';
      respawnButton.textContent = 'Respawn Swarm';
      document.body.appendChild(respawnButton);
      respawnButton.addEventListener('click', respawn);

      window.addEventListener('resize', onWindowResize);

      tick();
    }

    function tick() {
      if (respawning) return;
      renderer.render(scene, camera);
      orbit.update();
      butterflies.forEach((b) => {
        b.position.y += b.velocity.y * clock.getDelta();
        b.position.x += b.velocity.x * clock.getDelta();
        b.rotation.x += clock.getDelta() * 0.5;
        b.rotation.y += clock.getDelta() * 0.5;
      });
      requestAnimationFrame(tick);
    }

    function respawn() {
      respawning = true;
      scene.children.forEach((o) => { if (o.geometry) scene.remove(o); });
      butterflies.length = 0;
      init();
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    window.addEventListener('load', init);
</script>
</body>
</html>
