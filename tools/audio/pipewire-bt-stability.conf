# 99-bt-stability.conf — Bluetooth speaker stutter/clipping fix
# Place in ~/.config/pipewire/pipewire.conf.d/
#
# Raises the DSP quantum so short CPU spikes (compiles, training, merges)
# can't starve the audio graph → no more underrun clicks/clips on BT SBC.
# Also pins the sample rate and disables rate negotiation.

context.properties = {
    default.clock.rate          = 48000
    default.clock.allowed-rates = [ 48000 ]
    default.clock.quantum       = 2048
    default.clock.min-quantum   = 1024
    default.clock.max-quantum   = 4096
    default.clock.quantum-limit = 8192

    # Never let the graph float its rate mid-stream (kills BT resync stutter)
    default.clock.ratelimit     = false
    default.clock.force-quantum = 2048
}
