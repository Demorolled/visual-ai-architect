# 51-bt-speaker.conf — WirePlumber Bluetooth speaker fix (minimal)
# Place in ~/.config/wireplumber/wireplumber.conf.d/
#
# ONLY prevents automatic profile-flipping to the headset (HFP) mode when a
# call-like stream appears — that mono 16kHz profile is where audio suddenly
# sounds clipped/robotic. Codec selection is left to auto-negotiation because
# budget speakers (INSIGNA NS-2810BT) fail to connect when we force codecs.

monitor.bluez.properties = {
    bluez5.roles = [ a2dp_sink ]
}
