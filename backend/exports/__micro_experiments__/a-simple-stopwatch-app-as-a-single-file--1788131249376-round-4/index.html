<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Stopwatch App</title><style>.app{max-width:960px;margin:0 auto;padding:24px;text-align:center;}.btn{padding:10px 20px;border:none;border-radius:5px;cursor:pointer;}.btn-primary{background-color:#28a745;color:white;}.btn-danger{background-color:#dc3545;color:white;}</style></head><body><div class="app"><h1>Stopwatch</h1><div class="row"><span id="timer">00:00:00</span><button id="startBtn" class="btn btn-primary" onclick="toggleStopwatch()">Start</button><button id="stopBtn" class="btn btn-danger" onclick="toggleStopwatch()">Stop</button><button id="resetBtn" class="btn" onclick="resetStopwatch()">Reset</button></div></div><script>let on=false,acc=0,t;function toggleStopwatch(){on=!on;document.getElementById('startBtn').textContent=on?'⏸':'▶';t=performance.now();if(on)tick();}function tick(){const now=performance.now(),elapsed=on?now-t:0;const s=Math.floor(elapsed/1000%60),m=Math.floor(elapsed/60000%60),h=Math.floor(elapsed/3600000%24);document.getElementById('timer').textContent=`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;if(on)requestAnimationFrame(tick);}function resetStopwatch(){acc=0;document.getElementById('timer').textContent='00:00:00';}</script></body></html>
