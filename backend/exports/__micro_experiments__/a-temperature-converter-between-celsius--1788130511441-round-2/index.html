<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Temperature Converter</title><style>body{font-family:Arial,sans-serif;background-color:#222;color:#fff;}.app{max-width:400px;margin:50px auto;padding:24px;border-radius:8px;background-color:#333;}input{padding:8px;width:calc(100%-16px);border:none;border-radius:4px;background-color:#444;color:#fff;}button{padding:8px 16px;border:none;border-radius:4px;background-color:#555;color:#fff;cursor:pointer;}button:hover{background-color:#666;}</style></head><body><div class="app"><h1>Temperature Converter</h1><div class="row"><label for="celsiusInput">Celsius</label><input type="number" id="celsiusInput" placeholder="Enter Celsius value" oninput="convertTemperature('celsiusInput', 'fahrenheitInput')"></div><div class="row"><label for="fahrenheitInput">Fahrenheit</label><input type="number" id="fahrenheitInput" placeholder="Enter Fahrenheit value" oninput="convertTemperature('fahrenheitInput', 'celsiusInput')"></div><button onclick="clearInputs()">Clear</button></div><script>const toF = c => c * 9 / 5 + 32;const toC = f => (f - 32) * 5 / 9;function convertTemperature(inputId, outputId) {const value = parseFloat(document.getElementById(inputId).value);document.getElementById(outputId).value = isNaN(value) ? '' : (inputId === 'celsiusInput' ? toF(value) : toC(value)).toFixed(1);}function clearInputs() {document.getElementById('celsiusInput').value = '';document.getElementById('fahrenheitInput').value = '';}</script></body></html>
