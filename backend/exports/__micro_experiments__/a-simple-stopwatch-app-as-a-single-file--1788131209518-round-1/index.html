<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Stopwatch App</title><style>.app{max-width:960px;margin:0 auto;padding:24px;text-align:center;}.btn{padding:10px 20px;border:none;border-radius:5px;cursor:pointer;}.btn-primary{background-color:#28a745;color:white;}.btn-danger{background-color:#dc3545;color:white;}</style></head><body><div class="app"><h1>Stopwatch</h1><div class="row"><span id="timer">00:00:00</span><button id="startBtn" class="btn btn-primary" onclick="startStopwatch()">Start</button><button id="stopBtn" class="btn btn-danger" onclick="stopStopwatch()">Stop</button><button id="resetBtn" class="btn" onclick="resetStopwatch()">Reset</button></div></div><script>let on=false,acc=0,t,timerInterval=null;b.onclick=()=>{on=!on;b.textContent=on?'⏸':'▶';t=performance.now();if(on)tick();};function tick(){acc=on?performance.now()-t:0;const s=Math.floor(acc/1000%60),m=Math.floor(acc/60000%60),h=Math.floor(acc/3600000%24);document.getElementById('timer').textContent=`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;if(on)requestAnimationFrame(tick);};function startStopwatch(){if(!timerInterval){timerInterval=setInterval(tick,10);}}function stopStopwatch(){if(timerInterval){clearInterval(timerInterval);timerInterval=null;}}function resetStopwatch(){acc=0;document.getElementById('timer').textContent='00:00:00';}</script></body></html>
