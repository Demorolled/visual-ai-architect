<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Memory Match Game</title>
  <style>
    body {
      background-color: #0a0a14;
      color: #fff;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .app {
      max-width: 320px;
      width: 90%;
      padding: 24px;
      background-color: #12122a;
      border-radius: 12px;
      box-shadow: rgba(0, 0, 0, 0.2) 0 16px 32px;
      gap: 16px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
      gap: 8px;
    }

    .card {
      background-color: #2a2a40;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 16px;
      text-align: center;
      cursor: pointer;
    }

    .stats small {
      color: #94a5a6;
    }

    .btn {
      padding: 8px 16px;
      background-color: #2a9942;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    .btn:hover {
      background-color: #26703c;
    }

    .btn-primary {
      background-color: #4ade80;
    }

    .btn-primary:hover {
      background-color: #2dd476;
    }
  </style>
</head>
<body>
  <div class="app">
    <h2>Memory Match Game</h2>
    <div id="gameArea"></div>
    <div class="stats"><span id="moves">Moves: 0</span><span class="separator">|</span><span id="timer">Timer: 0s</span></div>
    <button class="btn" onclick="(typeof startGame === 'function' ? startGame : () => {}) ()">▶ Start Game</button>
  </div>

  <script>
const DOMContentLoaded = true;
</script>
</body>
</html>
