<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Chess</title>
    <style>
        body { margin: 0; }
        canvas { display: block; }
    </style>
</head>
<body>
    <div class="app">
        <h1>3D Chess</h1>
        <button id="playBtn" class="btn" onclick="play()">▶ Play</button>
        <canvas id="threejsCanvas"></canvas>
        <div id="statusMsg" role="status" style="padding:8px 12px;border-radius:8px;margin-top:10px"></div>
    </div>
    <script>
import { AI } from "./ai.js";

class Game {
    constructor() {
        this.board = [];
        this.turn = "white";
        this.AI = new AI();
        this.setupBoard();
    }

    setupBoard() {
        const boardSize = 8;
        for (let y = 0; y < boardSize; y++) {
            this.board[y] = [];
            for (let x = 0; x < boardSize; x++) {
                this.board[y][x] = new Tile(x, y);
            }
        }
    }

    startGame() {
        this.render();
        this.listenToUserInput();
        this.AI.startPlaying();
    }

    render() {
        // Initialize three.js scene
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer();
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Add board to scene
        this.board.forEach((row) => row.forEach((tile) => tile.addToScene(scene)));

        // Animation loop
        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }
        animate();

        // Move piece animation
        function animatePieceMove(piece, targetTile) {
            const start = piece.position;
            const end = targetTile.position;
            const duration = 1000; // 1 second

            // Move piece smoothly
            const startTransform = new THREE.Matrix4().makeTranslation(start.x, start.y, start.z);
            const endTransform = new THREE.Matrix4().makeTranslation(end.x, end.y, end.z);

            const animation = new THREE.LinearKeyframeTrack(
                "[piece].position",
                [0, 1],
                [startTransform.getTranslation(new THREE.Vector3()), endTransform.getTranslation(new THREE.Vector3())]
            );

            const animationClip = new THREE.AnimationClip("Move", duration, [animation]);
            const mixer = new THREE.AnimationMixer(piece.mesh);
            const action = mixer.clipAction(animationClip);
            action.play();
        }

        // User input listener
        window.addEventListener("click", (event) => {
            const target = new THREE.Vector3(event.clientX, event.clientY, 0);
            camera.unproject(target);
            const clickedTile = this.findTileAt(target);
            if (clickedTile && clickedTile.piece && clickedTile.piece.team === this.turn) {
                clickedTile.piece.moveTo(clickedTile);
                this.turn = this.turn === "white" ? "black" : "white";
                this.AI.makeMove();
            }
        });
    }

    listenToUserInput() {
        document.addEventListener("keydown", (event) => {
            if (event.key === "ArrowUp" && this.turn === "white") {
                this.AI.makeMove();
            }
        });
    }

    findTileAt(point) {
        const x = Math.floor(point.x / 100);
        const y = Math.floor(point.y / 100);
        return this.board[y][x];
    }

    makeMove(piece, targetTile) {
        piece.moveTo(targetTile);
        this.turn = this.turn === "white" ? "black" : "white";
        this.AI.makeMove();
    }
}

export default Game;
</script>

    <script>
export function animatePiece(piece, start, end, duration) {
    const scene = piece.scene;
    const camera = piece.camera;
    const renderer = piece.renderer;

    const startTransform = new THREE.Matrix4().extractRotation(piece.matrixWorld);
    const endTransform = new THREE.Matrix4().extractRotation(end.matrixWorld);

    const startTranslation = new THREE.Vector3().setFromMatrixPosition(start.matrixWorld);
    const endTranslation = new THREE.Vector3().setFromMatrixPosition(end.matrixWorld);

    const startScale = new THREE.Vector3().setFromMatrixScale(start.matrixWorld);
    const endScale = new THREE.Vector3().setFromMatrixScale(end.matrixWorld);

    const startRotation = new THREE.Euler().setFromMatrix(startTransform);
    const endRotation = new THREE.Euler().setFromMatrix(endTransform);

    const animation = new THREE.AnimationClip('move', duration, [
        new THREE.Interpolant(startTranslation, endTranslation, THREE.LinearInterpolant),
        new THREE.Interpolant(startRotation, endRotation, THREE.LinearInterpolant),
        new THREE.Interpolant(startScale, endScale, THREE.LinearInterpolant)
    ]);

    const action = new THREE.AnimationAction('move', animation);
    action.setTarget(piece);

    const mixer = new THREE.AnimationMixer(piece);
    mixer.clipAction('move', action).play();

    const clock = new THREE.Clock();
    let time = 0;

    function animate() {
        time += clock.getDelta();
        renderer.render(scene, camera);
        if (time < duration) {
            requestAnimationFrame(animate);
        }
    }

    animate();
}
</script>
    <script>
export interface Tile {
    x: number;
    y: number;
    piece: string | null;
}

const boardSize = 8;

export const createBoard = () => {
    const board = new Array(boardSize).fill(null).map(() => new Array(boardSize).fill(null));

    for (let y = 0; y < boardSize; y++) {
        for (let x = 0; x < boardSize; x++) {
            board[y][x] = { x, y, piece: null };
        }
    }

    return board;
};

export const placePiece = (board: Tile[][], tile: Tile, piece: string) => {
    tile.piece = piece;
    board[tile.y][tile.x] = tile;
};

export const removePiece = (board: Tile[][], tile: Tile) => {
    tile.piece = null;
    board[tile.y][tile.x] = { x: tile.x, y: tile.y, piece: null };
};

export const isValidMove = (board: Tile[][], start: Tile, end: Tile) => {
    const { x: startX, y: startY } = start;
    const { x: endX, y: endY } = end;

    return startX === endX && startY === endY;
};
</script>

        // Initialize and run the game
        document.addEventListener('DOMContentLoaded', () => {
            const canvas = document.getElementById('threejsCanvas');
            const game = new Game(canvas, new AI(), new Animations());
