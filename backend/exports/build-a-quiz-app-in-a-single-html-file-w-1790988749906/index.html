<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiz App</title><style>body{font-family:system-ui,sans-serif;}#question{margin-bottom:10px;}#options{display:flex;gap:10px;}#score{margin-top:20px;}button{padding:5px 10px;font-size:16px;}button:hover{cursor:pointer;}</style></head><body><div id="question"></div><div id="options"></div><div id="score"></div><script>let score=0,qIndex=0,questions=[{question:"What is the capital of France?",options:["Paris","London","Berlin","Madrid"],answer:"Paris"},{question:"What is 2+2?",options:["3","4","5","6"],answer:"4"}];function displayQuestion(){if(qIndex>=questions.length){document.getElementById('question').innerHTML='Quiz completed!';document.getElementById('options').innerHTML='';return;}document.getElementById('question').innerHTML=questions[qIndex].question;const optionsDiv=document.getElementById('options');optionsDiv.innerHTML='';questions[qIndex].options.forEach(opt=>{const btn=document.createElement('button');btn.textContent=opt;btn.addEventListener('click',()=>{checkAnswer(opt)});optionsDiv.appendChild(btn);});}function checkAnswer(ans){if(ans===questions[qIndex].answer){score+=1;}qIndex+=1;displayQuestion();}displayQuestion();</script></body></html>
