<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Level 1 Shooter</title>
  <style>
    body { margin: 0; font-family: Arial, sans-serif; background: #1c1c24; color: #bfbfbf; }
    .container { max-width: 720px; margin: 64px auto; padding: 0 16px; }
    .top-bar { display: flex; align-items: center; gap: 16px; }
    .top-bar button { padding: 8px 16px; border-radius: 4px; font-size: 16px; cursor: pointer; background: #2b2b3c; color: #bfbfbf; border: none; }
    .game-container { display: none; border: 1px solid #2b2b3c; padding: 16px; background: #15152a; border-radius: 4px; }
    .game-container canvas { display: block; width: 100%; height: 480px; background: #000; border: none; }
    .game-container .score { color: #bfbfbf; margin-top: 8px; text-align: center; }
    .game-container .game-over { display: none; margin-top: 16px; text-align: center; color: #ff0000; }
  </style>
</head>
<body>
  <div class="container">
    <div class="top-bar">
      <div>
        <h1>Level 1 Shooter</h1>
        <p>Move and hide from the enemy.</p>
      </div>
      <button id="startGameBtn" class="btn" onclick="startGame()">Start Game</button>
    </div>
    <div id="game-container" class="game-container">
      <canvas id="gameCanvas"></canvas>
      <p class="score">Score: 0</p>
      <div class="game-over">Game Over</div>
    </div>
  </div>
  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreDisplay = document.querySelector('.score');
    let playerX = 300, playerY = 400;
    let playerSpeed = 2;
    let score = 0;
    let isGameOver = false;

    function drawPlayer() {
      ctx.beginPath();
      ctx.arc(playerX, playerY, 20, 0, Math.PI * 2);
      ctx.fillStyle = '#ff0000';
      ctx.fill();
      ctx.closePath();
    }

    function drawRectangle(x, y, width, height) {
      ctx.beginPath();
      ctx.rect(x, y, width, height);
      ctx.fillStyle = '#00ff00';
      ctx.fill();
      ctx.closePath();
    }

    function drawScore() {
      ctx.font = '16px Arial';
      ctx.fillStyle = '#bfbfbf';
      ctx.fillText(`Score: ${score}`, 16, 16);
    }

    function startGame() {
      canvas.width = 600;
      canvas.height = 500;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawPlayer();
      drawRectangle(200, 200, 40, 40);
      drawScore();
    }

    function update() {
      if (isGameOver) return;
      const rect = { x: 200, y: 200, width: 40, height: 40 };
      if (playerX >= rect.x && playerX <= rect.x + rect.width && playerY >= rect.y && playerY <= rect.y + rect.height) {
        score++;
        scoreDisplay.textContent = `Score: ${score}`;
      }
      if (playerX < 0) playerX = 0;
      if (playerX > canvas.width - 40) playerX = canvas.width - 40;
      if (playerY < 0) playerY = 0;
      if (playerY > canvas.height - 40) playerY = canvas.height - 40;
      drawPlayer();
      drawRectangle(rect.x, rect.y, rect.width, rect.height);
      drawScore();
    }

    function gameLoop() {
      update();
      requestAnimationFrame(gameLoop);
    }

    canvas.addEventListener('keydown', (e) => {
      if (isGameOver) return;
      if (e.key === 'ArrowLeft') playerX -= playerSpeed;
      if (e.key === 'ArrowRight') playerX += playerSpeed;
      if (e.key === 'ArrowUp') playerY -= playerSpeed;
      if (e.key === 'ArrowDown') playerY += playerSpeed;
    });

    startGame();
    gameLoop();
  </script>
</body>
</html>
