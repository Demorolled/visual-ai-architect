<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memory Match</title>
<style>
  body { font-family: 'Segoe UI', sans-serif; background: #0a0a14; color: #e6e6e6;
         display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
  .wrap { text-align: center; }
  .stats { display: flex; justify-content: center; gap: 24px; margin: 12px 0; font-size: 15px; }
  .stats b { color: #00d9ff; }
  #grid { display: grid; grid-template-columns: repeat(4, 90px); gap: 10px; justify-content: center; }
  .card { width: 90px; height: 90px; border-radius: 10px; display: flex; align-items: center;
          justify-content: center; font-size: 34px; cursor: pointer; user-select: none;
          background: #1e2a3a; border: 2px solid #2a3a4a; transition: transform .15s; }
  .card.flipped, .card.matched { background: #14141f; border-color: #00d9ff; }
  .card.matched { border-color: #3ddc84; }
  #msg { min-height: 22px; margin: 12px 0; color: #3ddc84; }
  button { background: #00d9ff; color: #04141a; border: none; border-radius: 8px;
           padding: 10px 18px; font-size: 15px; cursor: pointer; }
</style>
</head>
<body>
<div class="wrap">
  <h2>Memory Match</h2>
  <div class="stats"><span>Moves: <b id="moves">0</b></span><span>Pairs: <b id="pairs">0</b>/8</span><span>Time: <b id="time">0s</b></span></div>
  <div id="grid"></div>
  <div id="msg"></div>
  <button id="newBtn">New Game</button>
</div>
<script>
  const EMOJIS = ['🍎','🍌','🍇','🍓','🍒','🍑','🍉','🍋'];
  const TOTAL_PAIRS = 8;
  let cards = [];
  let firstIndex = -1;
  let moves = 0;
  let matchedPairs = 0;
  let seconds = 0;
  let timerId = null;

  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function buildDeck() {
    const deck = [];
    for (const emoji of EMOJIS) {
      deck.push({ emoji: emoji, matched: false });
      deck.push({ emoji: emoji, matched: false });
    }
    return shuffle(deck);
  }

  function startTimer() {
    if (timerId !== null) return;
    timerId = setInterval(() => {
      seconds += 1;
      document.getElementById('time').textContent = seconds + 's';
    }, 1000);
  }

  function stopTimer() {
    if (timerId !== null) {
      clearInterval(timerId);
      timerId = null;
    }
  }

  function render() {
    const grid = document.getElementById('grid');
    grid.innerHTML = '';
    cards.forEach((card, i) => {
      const el = document.createElement('div');
      el.className = 'card' + (card.flipped || card.matched ? ' flipped' : '') +
                     (card.matched ? ' matched' : '');
      el.textContent = card.flipped || card.matched ? card.emoji : '?';
      el.addEventListener('click', () => handleClick(i));
      grid.appendChild(el);
    });
    document.getElementById('moves').textContent = moves;
    document.getElementById('pairs').textContent = matchedPairs;
  }

  function handleClick(index) {
    const card = cards[index];
    if (card.flipped || card.matched) return;
    if (firstIndex === -1) {
      firstIndex = index;
      card.flipped = true;
      render();
      return;
    }
    if (firstIndex === index) return;
    card.flipped = true;
    moves += 1;
    render();
    const a = cards[firstIndex];
    const b = card;
    if (a.emoji === b.emoji) {
      a.matched = true;
      b.matched = true;
      matchedPairs += 1;
      firstIndex = -1;
      render();
      if (matchedPairs === TOTAL_PAIRS) {
        winGame();
      }
    } else {
      setTimeout(() => {
        a.flipped = false;
        b.flipped = false;
        firstIndex = -1;
        render();
      }, 700);
    }
  }

  function winGame() {
    stopTimer();
    document.getElementById('msg').textContent = '🎉 You won in ' + moves +
      ' moves and ' + seconds + 's!';
  }

  function newGame() {
    stopTimer();
    cards = buildDeck();
    firstIndex = -1;
    moves = 0;
    matchedPairs = 0;
    seconds = 0;
    document.getElementById('msg').textContent = '';
    document.getElementById('time').textContent = '0s';
    render();
    startTimer();
  }

  document.getElementById('newBtn').addEventListener('click', newGame);
  newGame();
</script>
</body>
</html>
