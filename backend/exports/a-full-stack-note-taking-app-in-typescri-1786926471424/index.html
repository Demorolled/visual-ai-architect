<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Note Taking App</title>
  <style>
    .app { max-width: 960px; margin: 0 auto; padding: 24px; }
    .btn { padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer; }
    .btn-primary { background-color: #007bff; color: white; }
    .btn-danger { background-color: #dc3545; color: white; }
    .card { background: #15152a; border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 16px; margin-bottom: 12px; }
    .card h3 { margin: 0 0 8px; color: white; }
    .card p { margin: 0 0 12px; color: #888; }
  </style>
</head>
<body>
  <div class="app">
    <div class="row">
      <input id="titleInput" type="text" placeholder="Enter title" value="">
      <button id="saveBtn" class="btn btn-primary" onclick="addNote()">💾 Save</button>
    </div>
    <div id="noteList" class="grid"></div>
    <div id="statusMsg" role="status" style="padding:8px 12px;border-radius:8px;margin-top:10px"></div>
  </div>
  <script>
    const notes = [];

    function addNote() {
      const title = document.getElementById('titleInput').value.trim();
      if (title) {
        notes.push(title);
        document.getElementById('titleInput').value = '';
        renderNotes();
        document.getElementById('statusMsg').textContent = 'Note added!';
      } else {
        document.getElementById('statusMsg').textContent = 'Please enter a title.';
      }
    }

    function renderNotes() {
      const noteList = document.getElementById('noteList');
      noteList.innerHTML = '';
      notes.forEach(note => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `<h3>${note}</h3>`;
        noteList.appendChild(card);
      });
    }
  </script>
</body>
</html>
