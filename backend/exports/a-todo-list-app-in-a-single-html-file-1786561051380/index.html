<!DOCTYPE html><html lang='en'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><title>Todo List</title><style>body{font-family: Arial, sans-serif;background-color: #141414;color: #d0d0d0;text-align: center;padding: 20px;}#todos{margin-top: 20px;}label{display: block;margin: 5px 0;}input{width: 200px;height: 20px;padding: 5px;margin: 0 5px;}</style></head><body><h1>Todo List</h1><label>Task<input id='task'></label><button onclick='addTodo()'>Add</button><div id='todos'></div><script>const todos = [];function addTodo(){const task = document.getElementById('task').value.trim();if(!task){alert('Task cannot be empty');return;}todos.push({task, done: false});document.getElementById('task').value = '';renderTodos();}function renderTodos(){const todosEl = document.getElementById('todos');todosEl.innerHTML = '';for(const todo of todos){const done = todo.done ? 'done' : '';const el = document.createElement('div');el.className = `todo ${done}`;el.innerHTML = `<input type='checkbox' onchange='(typeof toggleDone === 'function' ? toggleDone : () => {}) (${todo.task})' ${todo.done ? 'checked' : ''}>${todo.task}`;todosEl.appendChild(el);}}</script></body></html>
