<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Note Taking App</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    h1 { color: #0056b3; }
    .container { max-width: 600px; margin: 0 auto; }
    .form-group { margin-bottom: 10px; }
    label { display: block; margin-bottom: 5px; }
    input[type="text"], textarea { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
    button { padding: 10px 15px; background-color: #0056b3; color: white; border: none; border-radius: 4px; cursor: pointer; }
    button:hover { background-color: #004488; }
    .notes { margin-top: 20px; }
    .note { background: #f9f9f9; padding: 10px; border: 1px solid #ddd; border-radius: 4px; margin-bottom: 5px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Note Taking App</h1>
    <div class="form-group">
      <label for="title">Title</label>
      <input type="text" id="title" placeholder="Enter title" required>
    </div>
    <div class="form-group">
      <label for="content">Content</label>
      <textarea id="content" placeholder="Enter content" required rows="5"></textarea>
    </div>
    <button onclick="addNote()">Add Note</button>
    <div class="notes" id="notes"></div>
  </div>

  <script>
    let notes = [];

    function addNote() {
      const title = document.getElementById('title').value;
      const content = document.getElementById('content').value;
      if (!title || !content) {
        alert('Please fill in both title and content.');
        return;
      }
      notes.push({ title, content });
      document.getElementById('title').value = '';
      document.getElementById('content').value = '';
      renderNotes();
    }

    function renderNotes() {
      const notesDiv = document.getElementById('notes');
      notesDiv.innerHTML = '';
      if (notes.length === 0) {
        notesDiv.innerHTML = '<p>No notes yet.</p>';
        return;
      }
      notes.forEach(note => {
        const noteDiv = document.createElement('div');
        noteDiv.className = 'note';
        noteDiv.innerHTML = `<h3>${note.title}</h3><p>${note.content}</p>`;
        notesDiv.appendChild(noteDiv);
      });
    }
  </script>
</body>
</html>
