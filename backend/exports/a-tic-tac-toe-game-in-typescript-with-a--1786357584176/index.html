<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe</title>
    <style>
        body { font-family: Arial, sans-serif; background: #1c1c2c; color: #ffffff; }
        .app { max-width: 960px; margin: 0 auto; padding: 24px; }
        .row, .col, .grid { gap: 10px; }
        .btn { background: #15152a; border: 1px solid #ffffff; padding: 8px 16px; cursor: pointer; margin: 0 8px 8px 0; }
        .btn-primary { background: #20202c; }
        .btn-danger { background: #b00020; }
        .card { background: #15152a; border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 16px; }
        .card:hover { box-shadow: 0 2px 8px rgba(255,255,255,0.1); }
        .grid { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
        .grid div { border: 1px solid #ffffff; }
    </style>
</head>
<body>
    <div class="app">
        <div class="col">
            <div class="card">
                <h3>Tic-Tac-Toe</h3>
                <p>Player X vs. Minimax AI</p>
                <button class="btn btn-primary" id="playBtn">▶ Play</button>
                <button class="btn btn-danger" id="delBtn">✕ Reset</button>
            </div>
            <div class="row">
                <div class="grid">
                    <div class="col" id="gameBoard" style="grid-column: 1 / 4; grid-row: 1 / 4; display: flex; flex-direction: column; justify-content: center; align-items: center;">
                        <div class="col" id="cell-1" style="grid-column: 1; grid-row: 1; width: 100px; height: 100px; border: 1px solid #ffffff; display: flex; justify-content: center; align-items: center;"></div>
                        <div class="col" id="cell-2" style="grid-column: 2; grid-row: 1; width: 100px; height: 100px; border: 1px solid #ffffff; display: flex; justify-content: center; align-items: center;"></div>
                        <div class="col" id="cell-3" style="grid-column: 3; grid-row: 1; width: 100px; height: 100px; border: 1px solid #ffffff; display: flex; justify-content: center; align-items: center;"></div>
                        <div class="col" id="cell-4" style="grid-column: 1; grid-row: 2; width: 100px; height: 100px; border: 1px solid #ffffff; display: flex; justify-content: center; align-items: center;"></div>
                        <div class="col" id="cell-5" style="grid-column: 2; grid-row: 2; width: 100px; height: 100px; border: 1px solid #ffffff; display: flex; justify-content: center; align-items: center;"></div>
                        <div class="col" id="cell-6" style="grid-column: 3; grid-row: 2; width: 100px; height: 100px; border: 1px solid #ffffff; display: flex; justify-content: center; align-items: center;"></div>
                        <div class="col" id="cell-7" style="grid-column: 1; grid-row: 3; width: 100px; height: 100px; border: 1px solid #ffffff; display: flex; justify-content: center; align-items: center;"></div>
                        <div class="col" id="cell-8" style="grid-column: 2; grid-row: 3; width: 100px; height: 100px; border: 1px solid #ffffff; display: flex; justify-content: center; align-items: center;"></div>
                        <div class="col" id="cell-9" style="grid-column: 3; grid-row: 3; width: 100px; height: 100px; border: 1px solid #ffffff; display: flex; justify-content: center; align-items: center;"></div>
                    </div>
                </div>
                <div class="row">
                    <button class="btn" id="saveBtn">💾 Save</button>
                </div>
            </div>
        </div>
    </div>
    <script>
        const gameBoard = document.getElementById('gameBoard');
        const cells = Array.from(document.querySelectorAll('#gameBoard .col'));
        const playBtn = document.getElementById('playBtn');
        const delBtn = document.getElementById('delBtn');
        const saveBtn = document.getElementById('saveBtn');

        let currentPlayer = 'X';
        let board = Array(9).fill(null);

        function drawBoard() {
            cells.forEach((cell, index) => {
                cell.textContent = board[index];
            });
        }

        function playMove(index) {
            if (!board[index]) {
                board[index] = currentPlayer;
                drawBoard();
                currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
                checkWin();
                if (!checkWin()) {
                    setTimeout(() => {
                        if (currentPlayer === 'O') {
                            let move = minimax(board, 'O');
                            board[move] = 'O';
                            drawBoard();
                            currentPlayer = 'X';
                            checkWin();
                        }
                    }, 300);
                }
            }
        }

        function minimax(board, player) {
            let winner = checkWin();
            if (winner !== null) return winner === 'O' ? 10 : -10;
            let availableCells = board.filter(cell => cell === null).map((_, index) => index);
            if (availableCells.length === 0) return 0;

            let bestMove = -1000;
            let bestValue = -1000;

            for (let move of availableCells) {
                board[move] = player;
                let value = -minimax(board, currentPlayer === 'X' ? 'O' : 'X');
                board[move] = null;
                if (value > bestValue) {
                    bestValue = value;
                    bestMove = move;
                }
            }
            return bestMove;
        }

        function checkWin() {
            let winningCombos = [
                [0, 1, 2],
                [3, 4, 5],
                [6, 7, 8],
                [0, 3, 6],
                [1, 4, 7],
                [2, 5, 8],
                [0, 4, 8],
                [2, 4, 6]
            ];
            for (let combo of winningCombos) {
                if (board[combo[0]] && board[combo[0]] === board[combo[1]] && board[combo[1]] === board[combo[2]]) {
                    return board[combo[0]];
                }
            }
            return null;
        }

        playBtn.addEventListener('click', () => {
            cells.forEach(cell => cell.textContent = '');
            board.fill(null);
            currentPlayer = 'X';
            drawBoard();
        });

        delBtn.addEventListener('click', () => {
            cells.forEach(cell => cell.textContent = '');
            board.fill(null);
        });

        saveBtn.addEventListener('click', () => {
            console.log(board);
        });

        cells.forEach(cell => cell.addEventListener('click', (e) => playMove(e.target.id.replace('cell-', ''))));
    </script>
</body>
</html>
