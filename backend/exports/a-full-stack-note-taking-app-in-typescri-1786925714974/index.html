<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #1c1c24;
      color: #ffffff;
      margin: 0;
      padding: 0;
    }
    .app {
      max-width: 960px;
      margin: 0 auto;
      padding: 24px;
    }
    .row {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .col {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 12px;
    }
    .btn {
      padding: 8px 16px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    .btn-primary {
      background-color: #28a745;
      color: #ffffff;
    }
    .btn-danger {
      background-color: #dc3545;
      color: #ffffff;
    }
    .card {
      background: #15152a;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 16px;
    }
    .card h3 {
      margin: 0 0 8px;
    }
    .card p {
      margin: 0 0 12px;
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="row">
      <input id="noteInput" type="text" placeholder="Enter note" value="">
      <button class="btn btn-primary" onclick="addNote()">➕ Add</button>
    </div>
    <div class="grid" id="noteList"></div>
  </div>

  <script>
    let notes = [];

    function addNote() {
      const input = document.getElementById('noteInput');
      const noteText = input.value.trim();
      if (noteText) {
        notes.push(noteText);
        input.value = '';
        renderNotes();
      }
    }

    function renderNotes() {
      const noteList = document.getElementById('noteList');
      noteList.innerHTML = '';
      notes.forEach(note => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `<h3>${note}</h3>`;
        noteList.appendChild(card);
      });
    }
  </script>
</body>
</html>
