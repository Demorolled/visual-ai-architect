<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2048</title>
<style>
  body { font-family: 'Segoe UI', sans-serif; background: #0a0a14; color: #e6e6e6;
         margin: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .wrap { text-align: center; }
  h2 { color: #00d9ff; margin: 0; }
  .hud { display: flex; justify-content: center; gap: 26px; margin: 10px 0; font-size: 14px; }
  .hud b { color: #ffb454; }
  #board { display: grid; grid-template-columns: repeat(4, 96px); gap: 10px; background: #1c1c2a;
           padding: 10px; border-radius: 12px; width: max-content; margin: 0 auto; }
  .cell { width: 96px; height: 96px; border-radius: 8px; background: #14141f;
          display: flex; align-items: center; justify-content: center; font-size: 34px; font-weight: 700;
          color: #e6e6e6; transition: background .1s; }
  .v2 { background: #1d3a2a; color: #3ddc84; } .v4 { background: #173a3a; color: #4dd8d8; }
  .v8 { background: #2a3a12; color: #9ddc3d; } .v16 { background: #3a2a12; color: #ffd166; }
  .v32 { background: #3a1a12; color: #ffb454; } .v64 { background: #3a1010; color: #ff8c5c; }
  .v128, .v256, .v512, .v1024, .v2048, .vbig { background: #00d9ff; color: #04141a; }
  #msg { min-height: 24px; margin: 12px 0; color: #ffb454; }
  button { background: #00d9ff; color: #04141a; border: none; border-radius: 8px; padding: 8px 18px; cursor: pointer; }
  .hint { color: #666; font-size: 11px; margin-top: 10px; }
</style>
</head>
<body>
<div class="wrap">
  <h2>2048</h2>
  <div class="hud"><span>Score <b id="score">0</b></span><span>Best <b id="best">0</b></span></div>
  <div id="board"></div>
  <div id="msg"></div>
  <button id="newBtn">New game</button>
  <div class="hint">arrow keys or WASD to slide — tiles with the same number merge</div>
</div>
<script>
  const N = 4;
  let grid = [];
  let score = 0;
  let best = parseInt(localStorage.getItem('g2048-best') || '0', 10);
  let over = false;
  let won = false;

  function blank() { return Array(N).fill(null).map(() => Array(N).fill(0)); }

  function emptyCells() {
    const out = [];
    for (let r = 0; r < N; r++)
      for (let c = 0; c < N; c++)
        if (grid[r][c] === 0) out.push({ r, c });
    return out;
  }

  function spawn() {
    const cells = emptyCells();
    if (!cells.length) return;
    const pick = cells[Math.floor(Math.random() * cells.length)];
    grid[pick.r][pick.c] = Math.random() < 0.9 ? 2 : 4;
  }

  function reset() {
    grid = blank();
    score = 0;
    over = false;
    won = false;
    document.getElementById('msg').textContent = '';
    spawn();
    spawn();
    draw();
  }

  function lineSlide(line) {
    const vals = line.filter(v => v !== 0);
    const out = [0, 0, 0, 0];
    let gained = 0;
    for (let i = 0; i < vals.length; i++) {
      if (i + 1 < vals.length && vals[i] === vals[i + 1]) {
        out.push(vals[i] * 2);
        gained += vals[i] * 2;
        i += 1;
      } else {
        out.push(vals[i]);
      }
    }
    while (out.length > N) out.shift();
    while (out.length < N) out.push(0);
    return { out, gained };
  }

  function move(dir) {
    if (over) return;
    let gained = 0;
    let moved = false;
    const next = blank();
    for (let i = 0; i < N; i++) {
      let line = [];
      for (let j = 0; j < N; j++) {
        const r = dir === 'up' ? j : dir === 'down' ? N - 1 - j : i;
        const c = dir === 'left' ? j : dir === 'right' ? N - 1 - j : i;
        line.push(grid[r][c]);
      }
      const res = lineSlide(line);
      gained += res.gained;
      for (let j = 0; j < N; j++) {
        const r = dir === 'up' ? j : dir === 'down' ? N - 1 - j : i;
        const c = dir === 'left' ? j : dir === 'right' ? N - 1 - j : i;
        if (next[r][c] !== res.out[j] && res.out[j] !== 0) moved = true;
        else if (grid[r][c] !== res.out[j]) moved = true;
        next[r][c] = res.out[j];
      }
    }
    if (!moved) return;
    grid = next;
    score += gained;
    if (score > best) { best = score; localStorage.setItem('g2048-best', String(best)); }
    spawn();
    checkState();
    draw();
  }

  function checkState() {
    for (let r = 0; r < N; r++)
      for (let c = 0; c < N; c++)
        if (grid[r][c] >= 2048 && !won) { won = true; document.getElementById('msg').textContent = '🎉 You win! Keep going for a higher score'; }
    const empties = emptyCells().length;
    if (empties === 0) {
      let canMerge = false;
      for (let r = 0; r < N && !canMerge; r++)
        for (let c = 0; c < N && !canMerge; c++) {
          if (c + 1 < N && grid[r][c] === grid[r][c + 1]) canMerge = true;
          if (r + 1 < N && grid[r][c] === grid[r + 1][c]) canMerge = true;
        }
      if (!canMerge) {
        over = true;
        document.getElementById('msg').textContent = '💀 Game over — no moves left! Score ' + score;
      }
    }
  }

  function tileClass(v) {
    if (v <= 2) return 'v2';
    if (v <= 4) return 'v4';
    if (v <= 8) return 'v8';
    if (v <= 16) return 'v16';
    if (v <= 32) return 'v32';
    if (v <= 64) return 'v64';
    if (v <= 2048) return 'v128';
    return 'vbig';
  }

  function draw() {
    const el = document.getElementById('board');
    el.innerHTML = '';
    for (let r = 0; r < N; r++) {
      for (let c = 0; c < N; c++) {
        const cell = document.createElement('div');
        cell.className = 'cell';
        const v = grid[r][c];
        if (v !== 0) {
          cell.textContent = v;
          cell.classList.add(tileClass(v));
        }
        el.appendChild(cell);
      }
    }
    document.getElementById('score').textContent = score;
    document.getElementById('best').textContent = best;
  }

  document.addEventListener('keydown', (e) => {
    const map = { ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down',
                  a: 'left', d: 'right', w: 'up', s: 'down' };
    const dir = map[e.key];
    if (dir) { e.preventDefault(); move(dir); }
  });
  document.getElementById('newBtn').addEventListener('click', reset);
  document.getElementById('best').textContent = best;
  reset();
</script>
</body>
</html>
