<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Note Taking App</title>
<style>
  body { font-family: Arial, sans-serif; background: #0a0a14; color: #ccc; margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; height: 100vh; }
  .app { max-width: 600px; padding: 20px; }
  h1 { color: #00d9ff; text-align: center; margin-bottom: 20px; }
  .row { display: flex; gap: 10px; margin-bottom: 10px; }
  .btn { padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; }
  .btn-primary { background: #00d9ff; color: #0a0a14; }
  .btn-secondary { background: #222; color: #ccc; }
  .card { background: #1a1a2e; border: 1px solid rgba(255,255,255,0.08); border-radius: 8px; padding: 12px; margin-bottom: 10px; }
  .card h2 { color: #00d9ff; margin: 0 0 8px; font-size: 18px; }
  .card p { color: #aaa; margin: 0 0 12px; }
  .notes-list { margin-top: 10px; }
  .notes-list li { margin-bottom: 8px; }
</style>
</head>
<body>
<div class="app">
  <h1>Note Taking App</h1>
  <div class="row">
    <input id="titleInput" type="text" placeholder="Title" style="flex: 1; padding: 8px 12px; border: 1px solid #333; border-radius: 4px; background: #1a1a2e; color: #ccc; font-size: 14px;">
    <button class="btn btn-primary" onclick="addNote()">➕ Add Note</button>
  </div>
  <ul id="notesList" class="notes-list"></ul>
</div>
<script>
  function addNote() {
    const title = document.getElementById('titleInput').value;
    if (!title) return;
    const note = { title, content: '' };
    const notes = JSON.parse(localStorage.getItem('notes') || '[]');
    notes.push(note);
    localStorage.setItem('notes', JSON.stringify(notes));
    document.getElementById('titleInput').value = '';
    renderNotes();
  }

  function renderNotes() {
    const notes = JSON.parse(localStorage.getItem('notes') || '[]');
    const list = document.getElementById('notesList');
    list.innerHTML = '';
    notes.forEach(n => {
      const li = document.createElement('li');
      li.className = 'card';
      li.innerHTML = `<h2>${n.title}</h2><p>${n.content}</p>`;
      list.appendChild(li);
    });
  }

  window.onload = renderNotes;
</script>
</body>
</html>
