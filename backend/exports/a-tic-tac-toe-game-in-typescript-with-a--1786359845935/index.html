<div class='app' style='max-width:960px;margin:0 auto;padding:24px'>
  <h1>Tic-Tac-Toe</h1>
  <div id='board' class='grid' style='grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:12px'>
    <div class='card' onclick='onMove(0)'>
      <p></p>
    </div>
    <div class='card' onclick='onMove(1)'>
      <p></p>
    </div>
    <div class='card' onclick='onMove(2)'>
      <p></p>
    </div>
    <div class='card' onclick='onMove(3)'>
      <p></p>
    </div>
    <div class='card' onclick='onMove(4)'>
      <p></p>
    </div>
    <div class='card' onclick='onMove(5)'>
      <p></p>
    </div>
    <div class='card' onclick='onMove(6)'>
      <p></p>
    </div>
    <div class='card' onclick='onMove(7)'>
      <p></p>
    </div>
    <div class='card' onclick='onMove(8)'>
      <p></p>
    </div>
  </div>
</div>
<script>
  const board = document.getElementById('board');
  const cells = Array.from(board.children);
  const game = { board: ['', '', '', '', '', '', '', '', ''], player: 'X', winner: null, isOver: false };
  const player = { symbol: 'X' };
  function onMove(index) {
    if (game.board[index] !== '') return;
    game.board[index] = player.symbol;
    cells[index].textContent = player.symbol;
    const winner = checkWin(game.board, player.symbol);
    if (winner) {
      game.winner = winner;
      game.isOver = true;
      alert('Player ' + winner + ' wins!');
      return;
    }
    const move = minimax(game, player.symbol);
    cells[move].textContent = game.player === 'X' ? 'O' : 'X';
    game.board[move] = game.player;
    game.player = game.player === 'X' ? 'O' : 'X';
    if (checkWin(game.board, game.player)) {
      game.winner = game.player;
      game.isOver = true;
      alert('Player ' + game.winner + ' wins!');
    }
  }
  function checkWin(board, player) {
    const winningCombinations = [
      [0, 1, 2], [3, 4, 5], [6, 7, 8], // rows
      [0, 3, 6], [1, 4, 7], [2, 5, 8], // columns
      [0, 4, 8], [2, 4, 6] // diagonals
    ];
    for (const combo of winningCombinations) {
      if (board[combo[0]] === player && board[combo[1]] === player && board[combo[2]] === player) {
        return player;
      }
    }
    return null;
  }
  function minimax(board, player, alpha = -1, beta = 1) {
    const winner = checkWin(board, player);
    if (winner) return winner === player ? 1 : -1;
    if (board.isOver) return 0;
    let score = -1;
    for (let i = 0; i < board.board.length; i++) {
      if (board.board[i] === '') {
        board.board[i] = player;
        const score = minimax(board, player === 'X' ? 'O' : 'X', alpha, beta);
        board.board[i] = '';
        if (player === 'X') {
          score > alpha && (alpha = score);
        } else {
          score < beta && (beta = score);
        }
        if (beta <= alpha) return alpha;
      }
    }
    return score;
  }
</script>
