<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Checkers Game</title>
<style>
  .game-container { display: flex; justify-content: center; align-items: center; height: 100vh; }
  .board { display: grid; grid-template-columns: repeat(8, 50px); grid-gap: 2px; width: 400px; height: 400px; }
  .square { width: 50px; height: 50px; }
  .black { background: #333; }
  .red { background: #ff4d4d; }
  .white { background: #fff; }
</style>
</head>
<body>
<div class="game-container" id="gameContainer"></div>
<script>
const gameContainer = document.getElementById('gameContainer');

function createBoard() {
  const board = document.createElement('div');
  board.className = 'board';
  for(let i = 0; i < 64; i++) {
    const square = document.createElement('div');
    square.className = `square ${i % 2 === 0 ? 'white' : 'black'}`;
    board.appendChild(square);
    if(i >= 24 && i < 32) square.style.backgroundColor = 'red';
    else if(i < 24) square.style.backgroundColor = 'white';
    square.addEventListener('click', () => {
      // Add game logic here
      console.log('Square', i, 'clicked');
    });
  }
  return board;
}

function startGame() {
gameContainer.innerHTML = '';
gameContainer.appendChild(createBoard());
}

startGame();
</script>
</body>
</html>
