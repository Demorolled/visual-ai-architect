<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Calculator</title><style>body{margin:0;background:#0e1424;color:#d0d0d0;font-family:system-ui,Helvetica,sans-serif;}.app{max-width:960px;margin:24px auto;padding:24px;background:#15152a;border-radius:12px;overflow:hidden;}.btn{padding:8px 16px;border:1px solid rgba(255,255,255,0.1);border-radius:8px;background:#2a344a;color:#d0d0d0;font-size:14px;cursor:pointer;transition:all 0.2s;}.btn:hover{background:#3a466a;}.btn:disabled{pointer-events:none;opacity:0.5;}.row{display:flex;gap:10px;align-items:center;}.col{display:flex;flex-direction:column;gap:10px;}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;}</style><div class="app" style="max-width:960px;margin:0 auto;padding:24px"> <div class="row"> <button id="addBtn" class="btn" onclick="add()">+</button> <button id="multBtn" class="btn" onclick="multiply()">×</button> </div> <div id="result" class="col"></div> </div><script>function add() { document.getElementById('result').textContent = 'Result: 2 + 2 = 4'; }function multiply() { document.getElementById('result').textContent = 'Result: 2 * 2 = 4'; }</script></head><body></body></html>
