<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Note-Taking App</title>
<style>
  :root { --bg:#0e1013; --card:#15152a; --border:#272c33; --text:#e8ebf1; --muted:#8b93a7; --accent:#ff7a59; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font:15px/1.5 'Segoe UI', system-ui, sans-serif; height:100vh; display:flex; flex-direction:column; align-items:center; padding:30px 16px; overflow-y:auto; }
  h1 { font-size:22px; margin-bottom:24px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:26px 36px; margin-bottom:20px; min-height:280px; display:flex; flex-direction:column; gap:14px; }
  form { display:flex; gap:8px; }
  input[type=text] { background:#0d0f13; border:1px solid var(--border); color:var(--text); border-radius:9px; padding:10px 12px; width:100%; font-size:15px; }
  input[type=text]:focus { outline:none; }
  select { background:#0d0f13; border:1px solid var(--border); color:var(--text); border-radius:9px; padding:8px 12px; width:100%; font-size:14px; }
  button { cursor:pointer; border:none; border-radius:9px; padding:10px 18px; font-size:14px; }
  .btn { background:var(--border); color:var(--text); }
  .btn.primary { background:var(--accent); color:#fff; }
  ul { list-style:none; margin:0; padding:0; }
  li { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:11px 14px; margin-bottom:8px; display:flex; align-items:center; gap:10px; min-height:50px; }
  li .text { flex:1; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
  li .del { background:none; color:var(--muted); font-size:15px; padding:4px; }
  li .del:hover { color:#ff5c6c; }
</style>
</head>
<body>
<h1>Note-Taking App</h1>
<div class="card">
  <form id="noteForm">
    <input id="titleInput" type="text" placeholder="Title..." autocomplete="off" maxlength="100" required>
    <textarea id="contentInput" placeholder="Write your note here...
