<meta name="viewport" content="width=device-width, initial-scale=1">
<div class="app" style="max-width:960px;margin:0 auto;padding:24px">  
  <div class="row" style="display:flex;gap:10px;align-items:center">    
    <div class="col" style="display:flex;flex-direction:column;gap:10px">      
      <h1>Quiz App</h1>
      <form id="quizForm" style="display:flex;flex-direction:column;gap:10px">        
        <div class="row" style="display:flex;gap:10px;align-items:center">          
          <label for="questionInput" style="min-width:100px">Question</label>          
          <input type="text" id="questionInput" placeholder="Enter question" value="">
        </div>
        <div class="row" style="display:flex;gap:10px;align-items:center">          
          <label for="answerInput" style="min-width:100px">Answer</label>          
          <input type="text" id="answerInput" placeholder="Enter answer" value="">
        </div>        
        <button id="submitBtn" class="btn" onclick="submitQuestion()">Submit</button>        
      </form>
    </div>

    <div class="col" style="display:flex;flex-direction:column;gap:10px">      
      <h2>Questions</h2>      
      <ul id="questionsList" style="list-style:none;padding:0;display:flex;flex-direction:column;gap:10px"></ul>
    </div>
  </div>
</div>

<script>
  const questions = [];

  function submitQuestion() {
    const questionInput = document.getElementById('questionInput');
    const answerInput = document.getElementById('answerInput');
    const question = questionInput.value.trim();
    const answer = answerInput.value.trim();

    if (question && answer) {
      questions.push({ question, answer });
      updateQuestionsList();
      questionInput.value = '';
      answerInput.value = '';
    } else {
      alert('Question and answer must not be empty.');
    }
  }

  function updateQuestionsList() {
    const questionsList = document.getElementById('questionsList');
    questionsList.innerHTML = '';
    questions.forEach((q, index) => {
      const li = document.createElement('li');
      li.textContent = `${index + 1}. ${q.question} - Answer: ${q.answer}`;
      questionsList.appendChild(li);
    });
  }
</script>
<style>
  .app {
    background-color: #222;
    color: #ddd;
  }

  .btn {
    padding: 8px 16px;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    background-color: #007bff;
    color: white;
  }

  .btn:hover {
    background-color: #0056b3;
  }

  input {
    padding: 8px;
    border: 1px solid #ccc;
    border-radius: 4px;
  }
</style>
