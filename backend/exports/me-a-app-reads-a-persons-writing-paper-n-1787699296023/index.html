<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Writing Paper Note</title>
  <style>
    body { font-family: Arial, sans-serif; background: #0a0a14; color: #ccc; margin: 0; padding: 20px; }
    h1 { color: #00d9ff; margin-bottom: 16px; }
    textarea { width: 100%; height: 300px; padding: 12px; background: #12121e; border: 1px solid #222; color: #ccc; font-size: 14px; font-family: 'Courier New', monospace; resize: vertical; }
    .preview { margin-top: 20px; background: #12121e; padding: 16px; border: 1px solid #222; }
    .preview h2 { color: #00d9ff; }
    .preview p { margin: 8px 0; }
    .btn { padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; }
    .btn-primary { background: #00d9ff; color: #0a0a14; }
    .btn-danger { background: #f87171; color: #0a0a14; }
  </style>
</head>
<body>
  <h1>Writing Paper Note</h1>
  <textarea id="noteInput" placeholder="Enter your note here..."></textarea>
  <div class="preview" id="previewPanel"></div>
  <div style="display: flex; gap: 8px; margin-top: 12px">
    <button class="btn btn-primary" onclick="renderPreview()">Render Preview</button>
    <button class="btn btn-danger" onclick="clearPreview()">Clear</button>
  </div>
  <script>
    function renderPreview() {
      const input = document.getElementById('noteInput').value;
      const preview = document.getElementById('previewPanel');
      preview.innerHTML = '<h2>Note Preview</h2><p>' + escapeHtml(input) + '</p>';
    }
    function clearPreview() {
      document.getElementById('noteInput').value = '';
      document.getElementById('previewPanel').innerHTML = '';
    }
    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }
  </script>
</body>
</html>
