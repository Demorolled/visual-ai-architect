<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Simple Check Game</title><style>
body{font-family:'Segoe UI',Arial,sans-serif;background:#0a0a14;color:#e0e0e0;margin:0;padding:20px;display:flex;justify-content:center;height:100vh}.app{max-width:960px;margin:0 auto;padding:24px}.btn{padding:8px 16px;border:none;border-radius:4px;cursor:pointer;transition:background 0.1s}.btn-primary{background:#00d9ff;color:#0a0a14}.btn-primary:hover{background:#00bcd4}.btn-danger{background:#ff4d4d;color:#0a0a14}.btn-danger:hover{background:#f44336}.board{display:grid;grid-template-columns:repeat(8,40px);gap:0}.cell{width:40px;height:40px;border:1px solid rgba(255,255,255,0.1);display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:600;cursor:pointer}.cell.red{color:#ff4d4d}.cell.black{color:#00bcd4}
</style><script>
const boardSize = 8;const pieces = [];let currentPlayer = 'red';function initBoard() {const board = document.getElementById('board');board.innerHTML = '';for (let row = 0; row < boardSize; row++) {for (let col = 0; col < boardSize; col++) {const cell = document.createElement('div');cell.className = 'cell';cell.dataset.row = row;cell.dataset.col = col;if ((row < 3 && (row + col) % 2 === 1) || (row > 4 && (row + col) % 2 === 1)) {cell.textContent = '○';cell.classList.add(currentPlayer);} else if ((row === 3 && (row + col) % 2 === 1) || (row === 4 && (row + col) % 2 === 1)) {cell.textContent = ' ';} else {cell.textContent = ' ';}cell.onclick = handleCellClick;board.appendChild(cell);}}const pieces = document.querySelectorAll('.cell');for (const piece of pieces) {const row = parseInt(piece.dataset.row);const col = parseInt(piece.dataset.col);if (piece.textContent === '○') {pieces.push({row,col,color:currentPlayer,selected:false});}}}function handleCellClick(e) {const row = parseInt(e.target.dataset.row);const col = parseInt(e.target.dataset.col);const piece = pieces.find(p => p.row === row && p.col === col);if (piece) {if (piece.selected) {piece.selected = false;e.target.classList.remove('selected');} else {pieces.forEach(p => p.selected = false);const selectedPiece = pieces.find(p => p.row === row && p.col === col);if (selectedPiece) {selectedPiece.selected = true;e.target.classList.add('selected');}}}}function resetGame() {const board = document.getElementById('board');board.innerHTML = '';initBoard();currentPlayer = 'red';}
</script></head><body><div class="app" style="max-width:960px;margin:0 auto;padding:24px"><h1>Simple Check Game</h1><div id="board" class="board" style="display:grid;grid-template-columns:repeat(8,40px);gap:0"></div><button id="resetBtn" class="btn btn-primary" onclick="resetGame()" style="margin-top:20px">🔄 Reset</button></div></body></html>
