<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tic-Tac-Toe Game</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0a0a14;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .app {
      text-align: center;
    }
    .board {
      display: grid;
      grid-template-columns: repeat(3, 100px);
      gap: 5px;
      margin: 20px 0;
    }
    .cell {
      width: 100px;
      height: 100px;
      border: 2px solid #444;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 48px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }
    .cell:hover {
      background: rgba(255,255,255,0.05);
    }
    .cell.x {
      color: #00d9ff;
    }
    .cell.o {
      color: #ff5722;
    }
    .status {
      font-size: 18px;
      margin-bottom: 20px;
    }
    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      margin: 5px;
      font-size: 16px;
    }
    .btn-primary {
      background: #00d9ff;
      color: #0a0a14;
    }
    .btn-secondary {
      background: #444;
      color: #fff;
    }
  </style>
</head>
<body>
  <div class="app">
    <h1>Tic-Tac-Toe Game</h1>
    <div class="status" id="status">It's X's turn</div>
    <div class="board" id="board"></div>
    <button class="btn btn-primary" onclick="(typeof restartGame === 'function' ? restartGame : () => {}) ()">Restart Game</button>
  </div>

  <script>

      [0, 1, 2], [3, 4, 5], [6, 7, 8],
      [0, 3, 6], [1, 4, 7], [2, 5, 8],
      [0, 4, 8], [2, 4, 6]
    ];

    let board = Array(9).fill(null);
    let currentPlayer = 'X';

    function renderBoard() {
      const boardEl = document.getElementById('board');
      boardEl.innerHTML = '';
      for (let i = 0; i < 9; i++) {
        const cell = document.createElement('div');
        cell.className = `cell`;
        cell.textContent = board[i] || '';
        cell.onclick = () => handleClick(i);
        boardEl.appendChild(cell);
      }
    }
