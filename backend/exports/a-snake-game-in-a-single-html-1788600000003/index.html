<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake</title>
<style>
  body { font-family: 'Segoe UI', sans-serif; background: #0a0a14; color: #e6e6e6;
         display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
  .wrap { text-align: center; }
  .stats { display: flex; justify-content: center; gap: 24px; margin: 10px 0; }
  .stats b { color: #00d9ff; }
  canvas { background: #0f0f1a; border: 1px solid #2a2a3a; border-radius: 8px; }
  #over { color: #ff5c5c; min-height: 22px; margin: 10px 0; }
  button { background: #00d9ff; color: #04141a; border: none; border-radius: 8px;
           padding: 8px 16px; font-size: 14px; cursor: pointer; }
</style>
</head>
<body>
<div class="wrap">
  <h2>Snake</h2>
  <div class="stats"><span>Score: <b id="score">0</b></span><span>Best: <b id="best">0</b></span></div>
  <canvas id="game" width="400" height="400"></canvas>
  <div id="over"></div>
  <button id="restartBtn">Restart</button>
</div>
<script>
  const SIZE = 20;
  const COLS = 20;
  const ROWS = 20;
  const TICK_MS = 120;
  let snake = [];
  let dir = { x: 1, y: 0 };
  let nextDir = { x: 1, y: 0 };
  let food = null;
  let score = 0;
  let best = parseInt(localStorage.getItem('snake-best') || '0', 10);
  let alive = true;
  let timerId = null;

  function placeFood() {
    while (true) {
      const x = Math.floor(Math.random() * COLS);
      const y = Math.floor(Math.random() * ROWS);
      if (!snake.some(s => s.x === x && s.y === y)) {
        food = { x: x, y: y };
        return;
      }
    }
  }

  function reset() {
    snake = [{ x: 5, y: 10 }, { x: 4, y: 10 }, { x: 3, y: 10 }];
    dir = { x: 1, y: 0 };
    nextDir = { x: 1, y: 0 };
    score = 0;
    alive = true;
    document.getElementById('over').textContent = '';
    placeFood();
    if (timerId !== null) { clearInterval(timerId); }
    timerId = setInterval(tick, TICK_MS);
    draw();
  }

  function changeDirection(newDir) {
    if (newDir.x === -dir.x && newDir.y === -dir.y) return;
    nextDir = newDir;
  }

  function tick() {
    if (!alive) return;
    dir = nextDir;
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
    if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS ||
        snake.some(s => s.x === head.x && s.y === head.y)) {
      gameOver();
      return;
    }
    snake.unshift(head);
    if (head.x === food.x && head.y === food.y) {
      score += 1;
      if (score > best) {
        best = score;
        localStorage.setItem('snake-best', String(best));
      }
      placeFood();
    } else {
      snake.pop();
    }
    draw();
  }

  function draw() {
    const ctx = document.getElementById('game').getContext('2d');
    ctx.fillStyle = '#0f0f1a';
    ctx.fillRect(0, 0, 400, 400);
    ctx.fillStyle = '#3ddc84';
    snake.forEach((seg, i) => {
      ctx.fillStyle = i === 0 ? '#00d9ff' : '#3ddc84';
      ctx.fillRect(seg.x * SIZE, seg.y * SIZE, SIZE - 2, SIZE - 2);
    });
    ctx.fillStyle = '#ff5c5c';
    ctx.fillRect(food.x * SIZE, food.y * SIZE, SIZE - 2, SIZE - 2);
    document.getElementById('score').textContent = score;
    document.getElementById('best').textContent = best;
  }

  function gameOver() {
    alive = false;
    if (timerId !== null) { clearInterval(timerId); timerId = null; }
    document.getElementById('over').textContent = '💀 Game over! Score: ' + score;
  }

  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowUp') changeDirection({ x: 0, y: -1 });
    if (e.key === 'ArrowDown') changeDirection({ x: 0, y: 1 });
    if (e.key === 'ArrowLeft') changeDirection({ x: -1, y: 0 });
    if (e.key === 'ArrowRight') changeDirection({ x: 1, y: 0 });
  });
  document.getElementById('restartBtn').addEventListener('click', reset);

  reset();
</script>
</body>
</html>
