<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Note Taker</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 0; }
    #notes { width: 100%; max-width: 600px; margin: 0 auto; padding: 20px; background: #f5f5f5; }
    h1 { text-align: center; color: #333; margin-bottom: 20px; }
    .note { margin-bottom: 10px; }
    .note input { width: 100%; padding: 10px; margin-bottom: 5px; }
    .note textarea { width: 100%; min-height: 50px; padding: 10px; margin-bottom: 10px; }
    .note button { padding: 5px 10px; background: #007bff; color: #fff; border: none; cursor: pointer; }
    .note button:hover { background: #0056b3; }
    .notes-list { display: flex; flex-direction: column; gap: 10px; }
    .notes-list button { padding: 5px 10px; background: #e0e0e0; border: 1px solid #ccc; border-radius: 5px; cursor: pointer; }
  </style>
</head>
<body>
  <div id="notes">
    <h1>📝 Note Taker</h1>
    <div class="notes-list"></div>
  </div>

</html>
