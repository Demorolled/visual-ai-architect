<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tic-Tac-Toe</title>
<style>
body {
  font-family: Arial, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  background: #24243e;
  color: #e0e0e0;
  margin: 0;
}
.board {
  display: grid;
  grid-template-columns: repeat(3, 100px);
  grid-template-rows: repeat(3, 100px);
  gap: 5px;
}
.cell {
  width: 100px;
  height: 100px;
  background: #333;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 50px;
  cursor: pointer;
  transition: background 0.2s;
}
.cell:hover {
  background: #444;
}
.cell.x {
  color: #4ade80;
}
.cell.o {
  color: #f87171;
}
</style>
</head>
<body>
<div class="board" id="board"></div>
<button id="restartBtn" class="btn" onclick="restartGame()">🔄 Restart</button>
<p id="statusMsg"></p>
<script>
const board = document.getElementById('board');
const statusMsg = document.getElementById('statusMsg');
const winningLines = [
  [0, 1, 2], [3, 4, 5], [6, 7, 8], // Rows
  [0, 3, 6], [1, 4, 7], [2, 5, 8], // Columns
  [0, 4, 8], [2, 4, 6]             // Diagonals
];
let currentPlayer = 'X';
let gameBoard = Array(9).fill(null);
let isGameActive = true;

function renderBoard() {
  board.innerHTML = '';
  for (let i = 0; i < 9; i++) {
    const cell = document.createElement('div');
    cell.className = 'cell';
    cell.dataset.index = i;
    cell.textContent = gameBoard[i] || '';
    cell.onclick = () => handleMove(i);
    board.appendChild(cell);
  }
}

function handleMove(index) {
  if (!isGameActive || gameBoard[index]) return;
  gameBoard[index] = currentPlayer;
  renderBoard();
  checkGameStatus();
  currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
}

function checkGameStatus() {
  for (const line of winningLines) {
    const [a, b, c] = line;
    if (gameBoard[a] && gameBoard[a] === gameBoard[b] && gameBoard[b] === gameBoard[c]) {
      isGameActive = false;
      announceWinner(gameBoard[a]);
      return;
    }
  }
  if (!gameBoard.includes(null)) {
    isGameActive = false;
    announceDraw();
  }
}

function announceWinner(winner) {
  statusMsg.textContent = `🎉 Player ${winner} wins!`;
  document.querySelectorAll('.cell').forEach(cell => {
    cell.classList.add('winner');
    if (winner === 'X') {
      cell.classList.add('x');
    } else {
      cell.classList.add('o');
    }
  });
}

function announceDraw() {
  statusMsg.textContent = '🤝 It\'s a draw!';
}

function restartGame() {
  currentPlayer = 'X';
  gameBoard = Array(9).fill(null);
  isGameActive = true;
  renderBoard();
  statusMsg.textContent = '';
}

renderBoard();
</script>
</body>
</html>
