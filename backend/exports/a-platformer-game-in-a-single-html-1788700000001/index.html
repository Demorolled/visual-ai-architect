<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sky Hop Platformer</title>
<style>
  body { font-family: 'Segoe UI', sans-serif; background: #0a0a14; color: #e6e6e6;
         margin: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .wrap { text-align: center; }
  h2 { color: #00d9ff; margin: 0 0 6px 0; }
  .hud { display: flex; justify-content: center; gap: 28px; margin: 8px 0; font-size: 13px; }
  .hud b { color: #ffb454; }
  canvas { background: #0f0f1a; border: 1px solid #2a2a3a; border-radius: 10px; display: block; }
  #status { min-height: 22px; margin: 10px 0; color: #ff5c5c; }
  button { background: #00d9ff; color: #04141a; border: none; border-radius: 8px;
           padding: 9px 18px; font-size: 14px; cursor: pointer; }
  .hint { color: #666; font-size: 11px; margin-top: 8px; }
</style>
</head>
<body>
<div class="wrap">
  <h2>Sky Hop</h2>
  <div class="hud"><span>Score <b id="score">0</b></span><span>Coins <b id="coins">0/5</b></span>
    <span>Lives <b id="livesDisp">3</b></span><span>Level <b id="levelDisp">1</b></span></div>
  <canvas id="game" width="640" height="400"></canvas>
  <div id="status"></div>
  <button id="restartBtn">Restart</button>
  <div class="hint">← → move · ↑ / space jump · collect coins · reach the flag</div>
</div>
<script>
  const W = 640, H = 400;
  const GRAVITY = 900;
  const MOVE_SPEED = 260;
  const JUMP_VEL = -420;
  const LEVELS = [
    { name: 'First Steps', spawn: { x: 40, y: 300 },
      platforms: [{ x: 0, y: 360, w: 240 }, { x: 300, y: 340, w: 120 }, { x: 460, y: 300, w: 180 }],
      coins: [{ x: 150, y: 330 }, { x: 340, y: 310 }, { x: 520, y: 270 }],
      enemies: [{ x: 360, y: 320, minx: 300, maxx: 420, dir: 1 }],
      flag: { x: 600, y: 240 } },
    { name: 'The Gaps', spawn: { x: 40, y: 300 },
      platforms: [{ x: 0, y: 360, w: 140 }, { x: 200, y: 320, w: 110 }, { x: 370, y: 280, w: 110 }, { x: 520, y: 240, w: 120 }],
      coins: [{ x: 250, y: 290 }, { x: 415, y: 250 }, { x: 570, y: 210 }],
      enemies: [{ x: 210, y: 300, minx: 200, maxx: 310, dir: 1 }, { x: 550, y: 220, minx: 520, maxx: 620, dir: -1 }],
      flag: { x: 600, y: 180 } },
    { name: 'Sky Steps', spawn: { x: 40, y: 300 },
      platforms: [{ x: 0, y: 360, w: 90 }, { x: 130, y: 320, w: 80 }, { x: 250, y: 280, w: 80 },
                  { x: 370, y: 240, w: 80 }, { x: 490, y: 200, w: 150 }],
      coins: [{ x: 165, y: 290 }, { x: 285, y: 250 }, { x: 405, y: 210 }, { x: 520, y: 170 }],
      enemies: [{ x: 260, y: 260, minx: 250, maxx: 330, dir: 1 }],
      flag: { x: 600, y: 140 } }
  ];
  let player = null;
  let keys = {};
  let score = 0;
  let coinsGot = 0;
  let lives = 3;
  let levelId = 0;
  let best = parseInt(localStorage.getItem('skh-best') || '0', 10);
  let rafId = null;
  let lastT = 0;
  let win = false;
  let dead = false;

  function resetPlayer() {
    const sp = LEVELS[levelId].spawn;
    player = { x: sp.x, y: sp.y, w: 22, h: 26, vx: 0, vy: 0, onGround: false };
  }

  function resetLevel() {
    resetPlayer();
    coinsGot = 0;
    dead = false;
  }

  function resetGame() {
    levelId = 0;
    score = 0;
    lives = 3;
    win = false;
    LEVELS.forEach(lv => lv.coins.forEach(c => c.got = false));
    resetLevel();
    document.getElementById('status').textContent = '';
  }

  function solidAt(p) {
    return LEVELS[levelId].platforms.some(pl =>
      player.x + player.w > pl.x && player.x < pl.x + pl.w &&
      player.y + player.h > pl.y && player.y + player.h < pl.y + 14 && player.vy >= 0);
  }

  function collidesWithPlatform(px, py) {
    return LEVELS[levelId].platforms.some(pl =>
      px + player.w > pl.x && px < pl.x + pl.w &&
      py + player.h > pl.y && py < pl.y + 14);
  }

  function updatePhysics(dt) {
    player.vx = 0;
    if (keys['ArrowLeft']) player.vx = -MOVE_SPEED;
    if (keys['ArrowRight']) player.vx = MOVE_SPEED;
    if ((keys['ArrowUp'] || keys[' ']) && player.onGround) {
      player.vy = JUMP_VEL;
      player.onGround = false;
    }
    player.vy += GRAVITY * dt;
    player.x += player.vx * dt;
    if (player.x < 0) player.x = 0;
    if (player.x > W - player.w) player.x = W - player.w;
    player.y += player.vy * dt;
    player.onGround = false;
    for (const pl of LEVELS[levelId].platforms) {
      if (player.x + player.w > pl.x && player.x < pl.x + pl.w) {
        const top = pl.y - player.h;
        if (player.vy >= 0 && player.y >= top - 12 && player.y <= top + 4) {
          player.y = top;
          player.vy = 0;
          player.onGround = true;
        }
      }
    }
    if (player.y > H + 40) loseLife();
  }

  function collectCoins() {
    for (const c of LEVELS[levelId].coins) {
      if (!c.got && Math.abs(player.x - c.x) < 26 && Math.abs(player.y - c.y) < 30) {
        c.got = true;
        coinsGot += 1;
        score += 50;
        document.getElementById('score').textContent = score;
      }
    }
  }

  function moveEnemies(dt) {
    for (const e of LEVELS[levelId].enemies) {
      e.x += e.dir * 60 * dt;
      if (e.x <= e.minx) e.dir = 1;
      if (e.x >= e.maxx) e.dir = -1;
      if (Math.abs(player.x - e.x) < 28 && Math.abs(player.y - e.y) < 30) loseLife();
    }
  }

  function checkFlag() {
    const f = LEVELS[levelId].flag;
    if (Math.abs(player.x - f.x) < 30 && Math.abs(player.y - f.y) < 40) {
      win = true;
      score += 200;
      document.getElementById('score').textContent = score;
      document.getElementById('status').textContent = '🏁 Level ' + (levelId + 1) + ' complete! +200';
      if (score > best) {
        best = score;
        localStorage.setItem('skh-best', String(best));
      }
      if (levelId + 1 < LEVELS.length) {
        levelId += 1;
        document.getElementById('levelDisp').textContent = levelId + 1;
        resetLevel();
        setTimeout(() => { win = false; }, 1200);
      } else {
        document.getElementById('status').textContent = '🏆 All levels complete! Final score ' + score;
        win = true;
      }
    }
  }

  function loseLife() {
    if (dead) return;
    dead = true;
    lives -= 1;
    document.getElementById('livesDisp').textContent = lives;
    if (lives <= 0) {
      document.getElementById('status').textContent = '💀 Game over — restart to try again';
      gameOver();
      return;
    }
    resetLevel();
  }

  function endSession() {
    if (rafId !== null) cancelAnimationFrame(rafId);
    rafId = null;
  }

  function gameOver() {
    endSession();
    document.getElementById('status').textContent += '  ·  best ' + best;
  }

  function draw() {
    const ctx = document.getElementById('game').getContext('2d');
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = '#0f0f1a';
    ctx.fillRect(0, 0, W, H);
    const lv = LEVELS[levelId];
    for (const pl of lv.platforms) {
      ctx.fillStyle = '#2a2a3a';
      ctx.fillRect(pl.x, pl.y, pl.w, 10);
      ctx.fillStyle = '#00d9ff';
      ctx.fillRect(pl.x, pl.y, pl.w, 2);
    }
    for (const c of lv.coins) {
      if (c.got) continue;
      ctx.fillStyle = '#ffd166';
      ctx.beginPath();
      ctx.arc(c.x, c.y, 8, 0, Math.PI * 2);
      ctx.fill();
    }
    for (const e of lv.enemies) {
      ctx.fillStyle = '#ff5c5c';
      ctx.fillRect(e.x - 11, e.y - 11, 22, 22);
    }
    ctx.fillStyle = '#3ddc84';
    ctx.fillRect(player.x, player.y, player.w, player.h);
    ctx.fillStyle = '#ffd166';
    ctx.fillRect(lv.flag.x, lv.flag.y, 8, 40);
    ctx.fillStyle = '#ffd166';
    ctx.beginPath();
    ctx.moveTo(lv.flag.x + 8, lv.flag.y);
    ctx.lineTo(lv.flag.x + 30, lv.flag.y + 8);
    ctx.lineTo(lv.flag.x + 8, lv.flag.y + 16);
    ctx.closePath();
    ctx.fill();
    document.getElementById('coins').textContent = coinsGot + '/5';
  }

  function loop(ts) {
    const dt = Math.min((ts - lastT) / 1000, 0.05);
    lastT = ts;
    if (!dead && !win) {
      updatePhysics(dt);
      collectCoins();
      moveEnemies(dt);
      checkFlag();
    }
    draw();
    if (rafId !== null) rafId = requestAnimationFrame(loop);
  }

  document.addEventListener('keydown', (e) => {
    keys[e.key] = true;
    if (e.key === 'ArrowUp' || e.key === ' ') e.preventDefault();
    if ((e.key === 'r' || e.key === 'R') && dead) resetGame();
  });
  document.addEventListener('keyup', (e) => { keys[e.key] = false; });
  document.getElementById('restartBtn').addEventListener('click', () => {
    resetGame();
    if (rafId !== null) cancelAnimationFrame(rafId);
    lastT = performance.now();
    rafId = requestAnimationFrame(loop);
  });

  document.getElementById('levelDisp').textContent = 1;
  resetGame();
  document.getElementById('score').textContent = score;
  lastT = performance.now();
  rafId = requestAnimationFrame(loop);
</script>
</body>
</html>
