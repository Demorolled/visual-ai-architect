<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Quiz App</title><style>.container{max-width:600px;margin:auto;padding:20px;}question{margin-bottom:15px;}button{margin-right:10px;}result{margin-top:20px;}</style></head><body><div class="container"><h2>Quiz App</h2><div id="quiz"></div><div id="result" style="display:none;"></div></div><script>const questions=[{q:"What is HTML?",a:"HyperText Markup Language",o:[]},{q:"What is CSS?",a:"Cascading Style Sheets",o:[]}];let score=0;function nextQuestion(i){if(i>=questions.length)return;const q=questions[i];const div=document.createElement('div');const prompt=document.createElement('p');prompt.textContent=q.q;const radio1=document.createElement('input');radio1.type='radio';radio1.value=q.a;const label1=document.createElement('label');label1.textContent=q.a;const radio2=document.createElement('input');radio2.type='radio';radio2.value='incorrect';const label2=document.createElement('label');label2.textContent='incorrect';const submit=document.createElement('button');submit.textContent='Submit';submit.onclick=()=>{if(radio1.checked)score++;nextQuestion(i+1);};div.append(prompt,radio1,label1,radio2,label2,submit);document.getElementById('quiz').innerHTML='';document.getElementById('quiz').append(div);}function showResult(){const resultDiv=document.getElementById('result');resultDiv.style.display='block';resultDiv.innerHTML=`<p>Your score: ${score}/${questions.length}</p>`;document.getElementById('quiz').style.display='none';}nextQuestion(0);</script></body></html>
