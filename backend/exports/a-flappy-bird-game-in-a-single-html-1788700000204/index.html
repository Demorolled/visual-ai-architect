<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flappy Bird</title>
<style>
  body { font-family: 'Segoe UI', sans-serif; background: #0a0a14; color: #e6e6e6;
         margin: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .wrap { text-align: center; }
  h2 { color: #00d9ff; margin: 0 0 6px 0; }
  .hud { display: flex; justify-content: center; gap: 28px; margin: 8px 0; font-size: 13px; }
  .hud b { color: #ffb454; }
  canvas { background: #0f0f1a; border: 1px solid #2a2a3a; border-radius: 10px; }
  #msg { min-height: 22px; margin: 8px 0; color: #ff5c5c; }
  button { background: #00d9ff; color: #04141a; border: none; border-radius: 8px; padding: 8px 16px; cursor: pointer; }
  .hint { color: #666; font-size: 11px; margin-top: 6px; }
</style>
</head>
<body>
<div class="wrap">
  <h2>Flappy Bird</h2>
  <div class="hud"><span>Score <b id="score">0</b></span><span>Best <b id="best">0</b></span></div>
  <canvas id="game" width="420" height="560"></canvas>
  <div id="msg"></div>
  <button id="restartBtn">Restart</button>
  <div class="hint">space / click to flap — dodge the pipes</div>
</div>
<script>
  const W = 420, H = 560;
  const GRAVITY = 1400;
  const FLAP = -420;
  const PIPE_W = 64;
  const PIPE_GAP = 160;
  const PIPE_SPEED = 170;
  const PIPE_INTERVAL = 1400;
  let bird = null;
  let pipes = [];
  let score = 0;
  let best = parseInt(localStorage.getItem('fb-best') || '0', 10);
  let state = 'ready';   // ready | playing | dead
  let lastT = 0;
  let rafId = null;
  let pipeTimer = 0;

  function resetBird() {
    bird = { x: 90, y: H / 2, vy: 0, r: 14 };
  }

  function reset() {
    resetBird();
    pipes = [];
    score = 0;
    state = 'ready';
    pipeTimer = 0;
    document.getElementById('msg').textContent = '';
    document.getElementById('score').textContent = 0;
    document.getElementById('best').textContent = best;
    lastT = performance.now();
    cancelAnimationFrame(rafId);
    rafId = requestAnimationFrame(loop);
  }

  function flap() {
    if (state === 'dead') return;
    if (state === 'ready') state = 'playing';
    bird.vy = FLAP;
  }

  function spawnPipe() {
    const minY = 70;
    const maxY = H - PIPE_GAP - 70;
    const gapY = minY + Math.random() * (maxY - minY);
    pipes.push({ x: W, gapY, passed: false, topH: gapY - PIPE_GAP / 2, botY: gapY + PIPE_GAP / 2 });
  }

  function update(dt) {
    if (state !== 'playing') return;
    pipeTimer -= dt * 1000;
    if (pipeTimer <= 0) {
      spawnPipe();
      pipeTimer = PIPE_INTERVAL * Math.max(0.65, 1 - score * 0.01);
    }
    bird.vy += GRAVITY * dt;
    bird.y += bird.vy * dt;
    if (bird.y > H - 40) { die('splat'); return; }
    if (bird.y < 0) { bird.y = 0; bird.vy = 0; }
    for (let i = pipes.length - 1; i >= 0; i--) {
      const p = pipes[i];
      p.x -= PIPE_SPEED * dt;
      if (p.x + PIPE_W < 0) { pipes.splice(i, 1); continue; }
      if (bird.x + bird.r > p.x && bird.x - bird.r < p.x + PIPE_W) {
        if (bird.y - bird.r < p.topH || bird.y + bird.r > p.botY) {
          die('hit pipe');
          return;
        }
      }
      if (!p.passed && p.x + PIPE_W < bird.x - bird.r) {
        p.passed = true;
        score += 1;
        document.getElementById('score').textContent = score;
        if (score > best) {
          best = score;
          localStorage.setItem('fb-best', String(best));
          document.getElementById('best').textContent = best;
        }
      }
    }
  }

  function die(reason) {
    state = 'dead';
    document.getElementById('msg').textContent = '💀 ' + reason + ' — score ' + score +
      ' (best ' + best + ')';
  }

  function draw() {
    const cvs = document.getElementById('game');
    const ctx = cvs.getContext('2d');
    ctx.fillStyle = '#0f0f1a';
    ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = '#2a2a3a';
    ctx.beginPath();
    for (let y = 0; y < H; y += 40) { ctx.moveTo(0, y); ctx.lineTo(W, y); }
    ctx.stroke();
    for (const p of pipes) {
      ctx.fillStyle = '#3ddc84';
      ctx.fillRect(p.x, 0, PIPE_W, p.topH);
      ctx.fillRect(p.x, p.botY, PIPE_W, H - p.botY);
      ctx.fillStyle = '#2a7d52';
      ctx.fillRect(p.x - 4, p.topH - 18, PIPE_W + 8, 18);
      ctx.fillRect(p.x - 4, p.botY, PIPE_W + 8, 18);
    }
    ctx.fillStyle = '#ffd166';
    ctx.beginPath();
    ctx.arc(bird.x, bird.y, bird.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#ff8c5c';
    ctx.beginPath();
    ctx.moveTo(bird.x + bird.r, bird.y);
    ctx.lineTo(bird.x + bird.r + 10, bird.y + 4);
    ctx.lineTo(bird.x + bird.r, bird.y + 8);
    ctx.closePath();
    ctx.fill();
  }

  function loop(ts) {
    const dt = Math.min((ts - lastT) / 1000, 0.05);
    lastT = ts;
    update(dt);
    draw();
    if (rafId !== null) rafId = requestAnimationFrame(loop);
  }

  document.addEventListener('keydown', (e) => {
    if (e.code === 'Space') { e.preventDefault(); flap(); }
    if (e.key === 'r' || e.key === 'R') reset();
  });
  document.getElementById('game').addEventListener('click', flap);
  document.getElementById('restartBtn').addEventListener('click', reset);

  document.getElementById('best').textContent = best;
  reset();
</script>
</body>
</html>
