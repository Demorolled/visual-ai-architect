<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Note Taking App</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f9;
      color: #333;
    }
    .app {
      max-width: 960px;
      margin: 0 auto;
      padding: 24px;
    }
    .btn {
      padding: 8px 16px;
      margin: 4px;
      cursor: pointer;
    }
    .btn-primary {
      background-color: #007bff;
      color: white;
      border: none;
    }
    .btn-danger {
      background-color: #dc3545;
      color: white;
      border: none;
    }
    .card {
      background: #15152a;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
    }
  </style>
</head>
<body>
  <div class="app" id="app"></div>
  <script>
    class NoteList {
      constructor(element) {
        this.element = element;
        this.notes = [];
      }

      render() {
        this.element.innerHTML = '<h2>Note List</h2>' + this.notes.map(note => `
          <div class="card">
            <h3>${note.title}</h3>
            <p>${note.content}</p>
          </div>
        `).join('');
      }
    }

    class NoteForm {
      constructor(element) {
        this.element = element;
      }

      render() {
        this.element.innerHTML = `
          <h2>Add Note</h2>
          <label for="titleInput">Title</label>
          <input id="titleInput" type="text" placeholder="Enter title">
          <label for="contentInput">Content</label>
          <textarea id="contentInput" placeholder="Enter content"></textarea>
          <button id="saveBtn" class="btn btn-primary">💾 Save</button>
        `;

        document.getElementById('saveBtn').onclick = () => {
          const title = document.getElementById('titleInput').value;
          const content = document.getElementById('contentInput').value;
          if (title && content) {
            this.notes.push({ title, content });
            this.render();
          }
        };
      }
    }

    class NoteApp {
      constructor(element) {
        this.element = element;
        this.notes = [];
        this.noteList = new NoteList(document.createElement('div'));
        this.noteForm = new NoteForm(document.createElement('div'));
      }

      render() {
        this.element.innerHTML = '';
        this.element.appendChild(this.noteList.element);
        this.element.appendChild(this.noteForm.element);
        this.noteList.render();
        this.noteForm.render();
      }
    }

    const appElement = document.getElementById('app');
    const noteApp = new NoteApp(appElement);
    noteApp.render();
  </script>
</body>
</html>
