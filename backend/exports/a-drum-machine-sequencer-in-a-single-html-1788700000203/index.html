<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Drum Sequencer</title>
<style>
  body { font-family: 'Segoe UI', sans-serif; background: #0a0a14; color: #e6e6e6;
         margin: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .wrap { text-align: center; }
  h2 { color: #00d9ff; margin: 0 0 10px 0; }
  .transport { display: flex; gap: 10px; justify-content: center; align-items: center; margin-bottom: 12px; }
  .transport button { background: #00d9ff; color: #04141a; border: none; border-radius: 8px;
                      padding: 8px 16px; cursor: pointer; font-size: 14px; }
  .transport button.ghost { background: #2a2a3a; color: #e6e6e6; }
  .transport input[type=range] { width: 120px; accent-color: #00d9ff; }
  .grid { display: grid; grid-template-columns: 40px repeat(16, 34px); gap: 3px; width: max-content;
          margin: 0 auto; background: #14141f; padding: 10px; border-radius: 12px; }
  .rowlabel { display: flex; align-items: center; justify-content: flex-end; padding-right: 8px;
              font-size: 13px; font-weight: 700; color: #aaa; }
  .step { width: 34px; height: 34px; border-radius: 6px; background: #24242f; cursor: pointer; }
  .step.on { background: #00d9ff; }
  .step.playing { box-shadow: inset 0 0 0 3px #ffd166; }
  .row-kick .rowlabel { color: #ff5c5c; } .row-snare .rowlabel { color: #ffd166; }
  .row-hat .rowlabel { color: #4dd8d8; } .row-bass .rowlabel { color: #8c5cff; }
  .pads { display: flex; gap: 8px; justify-content: center; margin-top: 14px; }
  .pad { width: 54px; height: 54px; border-radius: 50%; border: none; cursor: pointer; font-size: 11px; color: #04141a; font-weight: 700; }
  .stats { margin-top: 12px; font-size: 13px; }
  .stats b { color: #ffb454; }
</style>
</head>
<body>
<div class="wrap">
  <h2>🥁 Drum Sequencer</h2>
  <div class="transport">
    <button id="playBtn">▶ Play</button>
    <button class="ghost" id="clearBtn">Clear</button>
    <button class="ghost" id="saveBtn">💾 Save pattern</button>
    <label>Tempo <input type="range" id="tempo" min="60" max="180" value="120"></label>
  </div>
  <div class="grid" id="grid"></div>
  <div class="pads">
    <button class="pad" style="background:#ff5c5c" id="kickPad">KICK</button>
    <button class="pad" style="background:#ffd166" id="snarePad">SNARE</button>
    <button class="pad" style="background:#4dd8d8" id="hatPad">HAT</button>
    <button class="pad" style="background:#8c5cff;color:#fff" id="bassPad">BASS</button>
  </div>
  <div class="stats">step <b id="stepLbl">—</b> · pattern saved <b id="savedLbl">—</b></div>
</div>
<script>
  const ROWS = [
    { id: 'kick', label: 'Kick', color: '#ff5c5c' },
    { id: 'snare', label: 'Snare', color: '#ffd166' },
    { id: 'hat', label: 'Hat', color: '#4dd8d8' },
    { id: 'bass', label: 'Bass', color: '#8c5cff' }
  ];
  const STEPS = 16;
  let pattern = {};
  const NOTE_FREQ = { bass: 82.41 };
  ROWS.forEach(r => pattern[r.id] = Array(STEPS).fill(false));
  let playing = false;
  let pos = -1;
  let timerId = null;
  let ctx = null;
  let master = null;

  function audio() {
    if (ctx) return ctx;
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    master = ctx.createGain();
    master.gain.value = 0.5;
    master.connect(ctx.destination);
    return ctx;
  }

  function blip(freq, dur, type, vol) {
    const c = audio();
    const t = c.currentTime;
    const osc = c.createOscillator();
    const g = c.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(g);
    g.connect(master);
    osc.start(t);
    osc.stop(t + dur + 0.02);
  }

  function playRow(rowId) {
    if (rowId === 'kick') {
      blip(150, 0.12, 'sine', 0.9);
      blip(60, 0.09, 'sine', 0.7);
    } else if (rowId === 'snare') {
      blip(180, 0.08, 'triangle', 0.5);
      blip(400, 0.06, 'sawtooth', 0.2);
    } else if (rowId === 'hat') {
      blip(6000, 0.05, 'square', 0.12);
    } else if (rowId === 'bass') {
      blip(NOTE_FREQ.bass, 0.14, 'sawtooth', 0.35);
      blip(NOTE_FREQ.bass * 2, 0.1, 'sine', 0.15);
    }
  }

  function renderGrid() {
    const grid = document.getElementById('grid');
    grid.innerHTML = '';
    ROWS.forEach((row, ri) => {
      const label = document.createElement('div');
      label.className = 'rowlabel row-' + row.id;
      label.textContent = row.label;
      grid.appendChild(label);
      for (let s = 0; s < STEPS; s++) {
        const step = document.createElement('div');
        step.className = 'step row-' + row.id + (pattern[row.id][s] ? ' on' : '');
        if (pos === s) step.classList.add('playing');
        step.addEventListener('click', () => {
          pattern[row.id][s] = !pattern[row.id][s];
          if (pattern[row.id][s]) playRow(row.id);
          renderGrid();
        });
        grid.appendChild(step);
      }
    });
  }

  function tick() {
    pos = (pos + 1) % STEPS;
    document.getElementById('stepLbl').textContent = pos + 1;
    for (const row of ROWS) {
      if (pattern[row.id][pos]) playRow(row.id);
    }
    renderGrid();
  }

  function togglePlay() {
    if (playing) {
      playing = false;
      document.getElementById('playBtn').textContent = '▶ Play';
      clearInterval(timerId);
      timerId = null;
      pos = -1;
      renderGrid();
      return;
    }
    audio();
    if (ctx.state === 'suspended') ctx.resume();
    playing = true;
    document.getElementById('playBtn').textContent = '⏸ Stop';
    pos = -1;
    const interval = 60000 / parseInt(document.getElementById('tempo').value, 10) / 4;
    clearInterval(timerId);
    timerId = setInterval(tick, interval);
  }

  function savePattern() {
    try {
      localStorage.setItem('drum-pattern', JSON.stringify(pattern));
      document.getElementById('savedLbl').textContent = 'saved ✓';
      setTimeout(() => { document.getElementById('savedLbl').textContent = '—'; }, 1500);
    } catch (e) { document.getElementById('savedLbl').textContent = 'failed'; }
  }

  function loadPattern() {
    try {
      const saved = JSON.parse(localStorage.getItem('drum-pattern'));
      if (saved) {
        ROWS.forEach(r => { if (Array.isArray(saved[r.id]) && saved[r.id].length === STEPS) pattern[r.id] = saved[r.id]; });
      }
    } catch (e) { /* fresh */ }
  }

  document.getElementById('playBtn').addEventListener('click', togglePlay);
  document.getElementById('clearBtn').addEventListener('click', () => {
    ROWS.forEach(r => pattern[r.id] = Array(STEPS).fill(false));
    renderGrid();
  });
  document.getElementById('saveBtn').addEventListener('click', savePattern);
  document.getElementById('tempo').addEventListener('input', () => {
    if (playing) {
      clearInterval(timerId);
      timerId = setInterval(tick, 60000 / parseInt(document.getElementById('tempo').value, 10) / 4);
    }
  });
  ['kick', 'snare', 'hat', 'bass'].forEach((id, i) => {
    document.getElementById(id + 'Pad').addEventListener('click', () => playRow(id));
  });

  loadPattern();
  renderGrid();
</script>
</body>
</html>
