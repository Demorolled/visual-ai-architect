<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Canvas Paint</title>
<style>
  body { font-family: 'Segoe UI', sans-serif; background: #0a0a14; color: #e6e6e6;
         margin: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
  h2 { color: #00d9ff; margin: 14px 0 6px 0; }
  .toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: center;
             padding: 8px 14px; background: #14141f; border: 1px solid #2a2a3a; border-radius: 10px; margin-bottom: 10px; }
  .toolbar button { background: #2a2a3a; color: #e6e6e6; border: none; border-radius: 6px; padding: 6px 11px; cursor: pointer; font-size: 13px; }
  .toolbar button.on { background: #00d9ff; color: #04141a; }
  .toolbar input[type=color] { width: 36px; height: 32px; border: none; background: none; cursor: pointer; }
  .toolbar input[type=range] { width: 90px; accent-color: #00d9ff; }
  canvas { background: #101018; border: 1px solid #2a2a3a; border-radius: 10px; cursor: crosshair; }
  .hint { color: #666; font-size: 11px; margin-top: 8px; }
</style>
</head>
<body>
<h2>Canvas Paint</h2>
<div class="toolbar">
  <button id="penBtn" class="on">✏️ Pen</button>
  <button id="eraserBtn">🧽 Eraser</button>
  <button id="fillBtn">🪣 Fill</button>
  <input type="color" id="color" value="#00d9ff">
  <input type="range" id="size" min="1" max="40" value="6">
  <button id="undoBtn">↩ Undo</button>
  <button id="redoBtn">↪ Redo</button>
  <button id="clearBtn">🗑 Clear</button>
  <button id="downloadBtn">⬇ PNG</button>
  <button id="saveBtn">💾 Save</button>
</div>
<canvas id="canvas" width="800" height="500"></canvas>
<div class="hint">draw with the mouse · undo/redo stack · fill floods a region · PNG export &amp; localStorage autosave</div>
<script>
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  let tool = 'pen';
  let undoStack = [];
  let redoStack = [];
  let drawing = false;
  let lastX = 0, lastY = 0;

  function snapshot() {
    return canvas.toDataURL();
  }

  function pushState() {
    undoStack.push(snapshot());
    if (undoStack.length > 30) undoStack.shift();
    redoStack = [];
  }

  function restore(dataUrl) {
    const img = new Image();
    img.onload = () => ctx.drawImage(img, 0, 0);
    img.src = dataUrl;
  }

  function undo() {
    if (!undoStack.length) return;
    redoStack.push(snapshot());
    restore(undoStack.pop());
  }

  function redo() {
    if (!redoStack.length) return;
    undoStack.push(snapshot());
    restore(redoStack.pop());
  }

  function clear() {
    pushState();
    ctx.fillStyle = '#101018';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }

  function pos(e) {
    const rect = canvas.getBoundingClientRect();
    return { x: e.clientX - rect.left, y: e.clientY - rect.top };
  }

  function floodFill(x, y, color) {
    const img = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const data = img.data;
    const w = canvas.width;
    const idx = (y * w + x) * 4;
    const target = [data[idx], data[idx + 1], data[idx + 2], data[idx + 3]];
    const nr = parseInt(color.slice(1, 3), 16);
    const ng = parseInt(color.slice(3, 5), 16);
    const nb = parseInt(color.slice(5, 7), 16);
    const match = (i) => data[i] === target[0] && data[i + 1] === target[1] &&
                          data[i + 2] === target[2] && data[i + 3] === target[3];
    if (match(idx)) return;
    const stack = [[x, y]];
    while (stack.length) {
      const [cx, cy] = stack.pop();
      const i = (cy * w + cx) * 4;
      if (!match(i)) continue;
      data[i] = nr; data[i + 1] = ng; data[i + 2] = nb; data[i + 3] = 255;
      if (cx > 0) stack.push([cx - 1, cy]);
      if (cx < w - 1) stack.push([cx + 1, cy]);
      if (cy > 0) stack.push([cx, cy - 1]);
      if (cy < canvas.height - 1) stack.push([cx, cy + 1]);
    }
    ctx.putImageData(img, 0, 0);
  }

  function onDown(e) {
    if (tool === 'fill') {
      pushState();
      floodFill(Math.floor(pos(e).x), Math.floor(pos(e).y), document.getElementById('color').value);
      return;
    }
    drawing = true;
    pushState();
    const p = pos(e);
    lastX = p.x; lastY = p.y;
  }

  function onMove(e) {
    if (!drawing) return;
    const p = pos(e);
    const size = parseInt(document.getElementById('size').value, 10);
    const color = tool === 'eraser' ? '#101018' : document.getElementById('color').value;
    ctx.strokeStyle = color;
    ctx.lineWidth = size;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(lastX, lastY);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
    lastX = p.x; lastY = p.y;
  }

  function onUp() { drawing = false; autosave(); }

  function download() {
    const a = document.createElement('a');
    a.download = 'painting.png';
    a.href = canvas.toDataURL('image/png');
    a.click();
  }

  function autosave() {
    try { localStorage.setItem('paint-canvas', snapshot()); } catch (e) {}
  }

  function loadSaved() {
    try {
      const saved = localStorage.getItem('paint-canvas');
      if (saved) restore(saved);
    } catch (e) { /* fresh canvas */ }
  }

  document.getElementById('penBtn').addEventListener('click', () => {
    tool = 'pen';
    document.getElementById('penBtn').classList.add('on');
    document.getElementById('eraserBtn').classList.remove('on');
    document.getElementById('fillBtn').classList.remove('on');
  });
  document.getElementById('eraserBtn').addEventListener('click', () => {
    tool = 'eraser';
    document.getElementById('eraserBtn').classList.add('on');
    document.getElementById('penBtn').classList.remove('on');
    document.getElementById('fillBtn').classList.remove('on');
  });
  document.getElementById('fillBtn').addEventListener('click', () => {
    tool = 'fill';
    document.getElementById('fillBtn').classList.add('on');
    document.getElementById('penBtn').classList.remove('on');
    document.getElementById('eraserBtn').classList.remove('on');
  });
  document.getElementById('undoBtn').addEventListener('click', undo);
  document.getElementById('redoBtn').addEventListener('click', redo);
  document.getElementById('clearBtn').addEventListener('click', () => { clear(); autosave(); });
  document.getElementById('downloadBtn').addEventListener('click', download);
  document.getElementById('saveBtn').addEventListener('click', () => { autosave(); document.title = 'Canvas Paint ✓'; });
  canvas.addEventListener('mousedown', onDown);
  canvas.addEventListener('mousemove', onMove);
  canvas.addEventListener('mouseup', onUp);
  canvas.addEventListener('mouseleave', onUp);
  document.addEventListener('keydown', (e) => {
    if (e.ctrlKey && e.key === 'z') { e.preventDefault(); if (e.shiftKey) redo(); else undo(); }
    if (e.ctrlKey && e.key === 'y') { e.preventDefault(); redo(); }
  });

  clear();
  loadSaved();
</script>
</body>
</html>
