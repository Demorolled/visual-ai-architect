<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tic-Tac-Toe</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #0a0a14;
      margin: 0;
      font-family: 'Arial', sans-serif;
    }
    .container {
      text-align: center;
    }
    .board {
      display: grid;
      grid-template-columns: repeat(3, 100px);
      gap: 5px;
      margin: 20px auto;
    }
    .cell {
      width: 100px;
      height: 100px;
      background: #1a1a2e;
      border: 2px solid #2a2a40;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      cursor: pointer;
      transition: background 0.2s;
    }
    .cell:hover {
      background: #2a2a40;
    }
    .cell.x {
      color: #4ade80;
    }
    .cell.o {
      color: #f87171;
    }
    .winner {
      font-size: 1.5rem;
      color: #4ade80;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Tic-Tac-Toe</h1>
    <div class="board" id="board"></div>
    <button id="reset" style="padding: 10px 20px; font-size: 1rem; background: #1a1a2e; border: 2px solid #2a2a40; color: #fff; cursor: pointer;">Reset Game</button>
    <p id="winner" class="winner"></p>
  </div>

  <script>
    const board = document.getElementById('board');
    const resetButton = document.getElementById('reset');
    const winnerDisplay = document.getElementById('winner');
    let currentPlayer = 'X';
    let gameBoard = Array(9).fill(null);

    function renderBoard() {
      board.innerHTML = '';
      gameBoard.forEach((cell, index) => {
        const cellElement = document.createElement('div');
        cellElement.className = `cell ${cell}`;
        cellElement.textContent = cell || '';
        cellElement.addEventListener('click', () => handleCellClick(index));
        board.appendChild(cellElement);
      });
    }

    function handleCellClick(index) {
      if (gameBoard[index] || checkWinner()) {
        return;
      }
      gameBoard[index] = currentPlayer;
      currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
      renderBoard();
      const winner = checkWinner();
      if (winner) {
        winnerDisplay.textContent = `Player ${winner} wins!`;
        winnerDisplay.style.color = winner === 'X' ? '#4ade80' : '#f87171';
        disableBoard();
      } else if (gameBoard.every(cell => cell !== null)) {
        winnerDisplay.textContent = 'It\'s a tie!';
        winnerDisplay.style.color = '#64748b';
        disableBoard();
      }
    }

    function checkWinner() {
      const winningCombinations = [
        [0, 1, 2], [3, 4, 5], [6, 7, 8], // Rows
        [0, 3, 6], [1, 4, 7], [2, 5, 8], // Columns
        [0, 4, 8], [2, 4, 6]           // Diagonals
      ];

      for (const combination of winningCombinations) {
        const [a, b, c] = combination;
        if (gameBoard[a] && gameBoard[a] === gameBoard[b] && gameBoard[a] === gameBoard[c]) {
          return gameBoard[a];
        }
      }

      return null;
    }

    function disableBoard() {
      gameBoard.forEach((_, index) => {
        const cellElement = board.children[index];
        cellElement.removeEventListener('click', () => handleCellClick(index));
      });
    }

    resetButton.addEventListener('click', () => {
      gameBoard = Array(9).fill(null);
      currentPlayer = 'X';
      winnerDisplay.textContent = '';
      renderBoard();
    });

    renderBoard();
  </script>
</body>
</html>
